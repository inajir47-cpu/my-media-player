name: Live Preview & Build Exact APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  live-web-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Patched Web App for Live Testing
        run: |
          mkdir -p www
          cp true-konosuba-player.txt raw.html

          cat << 'EOF_PATCH' > patch.js
          const fs = require("fs");
          let html = fs.readFileSync("raw.html", "utf8");

          // 1. Remove Muse iframe bridge scripts
          html = html.replace(/<script data-hatch-cvm-opaque-url-compat[\s\S]*?<\/script>/, "");
          html = html.replace(/<script data-hatch-cvm-bridge[\s\S]*?<\/script>/, "");

          // 2. Clear static HTML snapshot so React mounts cleanly
