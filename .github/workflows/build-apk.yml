              }

              if (action === "getReviews") {
                var colR = db.collections.find(function(c) { return Number(c.id) === Number(args.collectionId); });
                return { reviews: (colR && colR.reviews) || [], checkedAt: new Date().toISOString() };
              }

              if (action === "refreshMetadata") {
                var colM = db.collections.find(function(c) { return Number(c.id) === Number(args.id); });
                if (colM) {
                  var refreshed = await lookupAllMetadata(colM.title, colM.kind, colM.year);
                  if (refreshed.posterUrl && (!colM.posterUrl || colM.posterUrl.indexOf("data:") !== 0)) {
                    colM.posterUrl = refreshed.posterUrl;
                  }
                  if (refreshed.synopsis) colM.synopsis = refreshed.synopsis;
                  if (refreshed.rating != null) {
                    colM.rating = refreshed.rating;
                    colM.ratingScale = refreshed.ratingScale;
                    colM.ratingSource = refreshed.ratingSource;
                  }
                  if (refreshed.seasons.length > 0) {
                    colM.seasons = refreshed.seasons;
                    colM.seasonCount = refreshed.seasons.length;
                  }
                  if (refreshed.episodes.length > 0 || (refreshed.seasons[0] && refreshed.seasons[0].isComingSoon)) {
                    var existingFiles = colM.files || [];
                    refreshed.episodes.forEach(function(ep) {
                      var mf = existingFiles.find(function(x) {
                        return x.seasonNumber === ep.seasonNumber && x.episodeNumber === ep.episodeNumber;
                      });
                      if (mf) ep.localFileName = mf.fileName;
                    });
                    colM.episodes = refreshed.episodes;
                  }
                  if (refreshed.relatedMedia.length > 0) colM.relatedMedia = refreshed.relatedMedia;
                  if (refreshed.reviews.length > 0) colM.reviews = refreshed.reviews;
                  saveDB(db);
                }
                return { ok: true };
              }

              if (action === "deleteCollection") {
                db.collections = db.collections.filter(function(c) { return Number(c.id) !== Number(args.id); });
                saveDB(db);
                return { ok: true };
              }

              return {};
            }

