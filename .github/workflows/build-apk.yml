                async function loadMore() {
                  if (genrePageState.loading || !genrePageState.hasMore) return;
                  genrePageState.loading = true;
                  var btn = document.getElementById('disc-more-btn');
                  if (btn) btn.textContent = 'Loading...';
                  genrePageState.page++;
                  var result = await fetchGenreFeed(genrePageState.genre, genrePageState.page);
                  genrePageState.hasMore = result.hasNextPage;
                  genrePageState.allItems = genrePageState.allItems.concat(result.items);
                  renderGridItems(result.items);
                  genrePageState.loading = false;
                  if (btn) {
                    if (!genrePageState.hasMore) {
                      document.getElementById('disc-loadmore').style.display = 'none';
                    } else {
                      btn.textContent = 'Load More';
