                  // View All for hentai
                  var vaBtn = document.querySelector('.disc-viewall-hentai');
                  if (vaBtn) vaBtn.onclick = function(){ showHentaiGrid(); };
                } catch(err) {
                  carousel.innerHTML = '<p style="color:#888;">Failed to load hentai</p>';
                }
              }
              function openHentaiDetail(e) {
                var m = hvMapResult(e);
                // Use the hanime detail flow
                if (window.showHanimeDetail) {
                  window.showHanimeDetail(m);
                } else if (typeof showHanimeDetail === 'function') {
