                  }
                }
                
                renderGridItems(genrePageState.allItems);
                document.getElementById('disc-more-btn').onclick = loadMore;
                // Infinite scroll
                disc.onscroll = function(){
                  if (disc.scrollTop + disc.clientHeight >= disc.scrollHeight - 200) loadMore();
                };
