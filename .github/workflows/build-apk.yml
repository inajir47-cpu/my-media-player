name: Build Original Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Unpack Real App & Compile Native APK
        run: |
          mkdir -p original-app
          unzip -o real-media-player.zip -d original-app
          cd original-app
          npm install
          npx vite build
          cp -r dist/* android/app/src/main/assets/public/
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Original APK
        uses: actions/upload-artifact@v4
        with:
          name: Original-Media-Player-APK
          path: "**/android/app/build/outputs/apk/debug/*.apk"
          
