              } catch (e) {}

              if (kind === "series" && result.seasons.length === 0) {
                try {
                  var r2 = await origFetch("https://api.tvmaze.com/singlesearch/shows?q=" + encodeURIComponent(title) + "&embed[]=episodes&embed[]=seasons");
