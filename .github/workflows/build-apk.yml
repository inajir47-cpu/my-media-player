      - name: Upload Web Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save Patched Web App for APK Job
        uses: actions/upload-artifact@v4
        with:
          name: patched-web-dir
          path: ./www/index.html

  build-apk:
    needs: live-web-preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Patched index.html
        uses: actions/download-artifact@v4
        with:
          name: patched-web-dir
          path: exact-app/www

      - name: Build Android APK
        run: |
          cd exact-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Media Player" "com.exact.mediaplayer" --web-dir www
          npx cap add android
          npx cap sync android

          cat << 'EOF_JAVA' > android/app/src/main/java/com/exact/mediaplayer/MainActivity.java
          package com.exact.mediaplayer;

          import android.os.Bundle;
          import android.webkit.WebView;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (getBridge() != null && getBridge().getWebView() != null) {
                              WebView webView = getBridge().getWebView();
                              webView.evaluateJavascript(
                                  "(function() { return window.__handleAndroidBack ? window.__handleAndroidBack() : false; })()",
                                  value -> {
                                      if (!"true".equals(value)) {
                                          runOnUiThread(() -> {
                                              setEnabled(false);
                                              MainActivity.super.onBackPressed();
                                              setEnabled(true);
                                          });
                                      }
                                  }
                              );
                          } else {
                              setEnabled(false);
                              MainActivity.super.onBackPressed();
                              setEnabled(true);
                          }
                      }
                  });
              }
          }
          EOF_JAVA

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Exact APK
        uses: actions/upload-artifact@v4
        with:
          name: Exact-Media-Player-APK
          path: "**/android/app/build/outputs/apk/debug/*.apk"
