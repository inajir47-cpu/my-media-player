                  var relationMap = {};
                  relationMap[rootMedia.id] = "Main story";

                  function walkEdges(edges) {
                    if (!edges) return;
                    edges.forEach(function(edge) {
                      var rel = edge && edge.relationType;
                      var node = edge && edge.node;
                      if (!node || node.type !== "ANIME" || VALID_RELATIONS.indexOf(rel) === -1) return;
                      if (!idSet.has(node.id)) {
                        idSet.add(node.id);
                        relationMap[node.id] = rel.replace(/_/g, " ");
                      }
                      if (node.relations && node.relations.edges) {
                        walkEdges(node.relations.edges);
                      }
                    });
                  }
                  walkEdges(rootMedia.relations && rootMedia.relations.edges);

                  var allIds = Array.from(idSet).slice(0, 45);
                  var batchQuery = "query ($ids: [Int]) { Page(perPage: 50) { media(id_in: $ids, type: ANIME) { id title { english romaji } description(asHtml: false) seasonYear startDate { year month day } format status episodes duration averageScore siteUrl nextAiringEpisode { episode airingAt timeUntilAiring } airingSchedule(perPage: 50) { nodes { episode airingAt timeUntilAiring } } coverImage { extraLarge large } streamingEpisodes { title thumbnail url } relations { edges { relationType(version: 2) node { id type format status title { english romaji } description(asHtml: false) seasonYear startDate { year month day } episodes duration averageScore siteUrl nextAiringEpisode { episode airingAt timeUntilAiring } coverImage { extraLarge large } } } } } } }";

                  var rBatch = await origFetch("https://graphql.anilist.co", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: JSON.stringify({ query: batchQuery, variables: { ids: allIds } })
                  });
                  var jBatch = await rBatch.json();
                  var mediaList = (jBatch && jBatch.data && jBatch.data.Page && jBatch.data.Page.media) || [rootMedia];

                  var nodeById = new Map();
                  mediaList.forEach(function(item) {
                    if (item && item.id) nodeById.set(item.id, item);
                  });
                  mediaList.forEach(function(item) {
                    var edges = (item && item.relations && item.relations.edges) || [];
                    edges.forEach(function(edge) {
                      var rel = edge && edge.relationType;
                      var node = edge && edge.node;
                      if (node && node.type === "ANIME" && VALID_RELATIONS.indexOf(rel) !== -1 && !nodeById.has(node.id)) {
                        nodeById.set(node.id, node);
                        if (!relationMap[node.id]) relationMap[node.id] = rel.replace(/_/g, " ");
                      }
                    });
                  });

                  var franchiseNodes = Array.from(nodeById.values()).filter(function(n) {
                    return n && n.format && n.status !== "CANCELLED";
                  });

                  franchiseNodes.sort(function(a, b) {
                    var aUnrel = a.status === "NOT_YET_RELEASED";
                    var bUnrel = b.status === "NOT_YET_RELEASED";
                    var da = formatAniDate(a.startDate, a.seasonYear, aUnrel) || (aUnrel ? "9999-12-30" : "9998-12-30");
                    var db = formatAniDate(b.startDate, b.seasonYear, bUnrel) || (bUnrel ? "9999-12-30" : "9998-12-30");
                    return da.localeCompare(db) || (a.id - b.id);
                  });

                  if (kind === "series") {
                    var tvNodes = franchiseNodes.filter(function(n) {
                      return n.format === "TV" || (n.id === rootMedia.id && n.format === "ONA");
                    });
                    if (tvNodes.length === 0) tvNodes = [rootMedia];

                    var aniSeasons = [];
                    var aniEpisodes = [];

                    tvNodes.forEach(function(tv, sIdx) {
                      var sNum = sIdx + 1;
                      var isComingSoon = tv.status === "NOT_YET_RELEASED";
                      var isReleasing = tv.status === "RELEASING";
                      var sYear = tv.seasonYear || (tv.startDate && tv.startDate.year) || null;
                      var sDate = formatAniDate(tv.startDate, sYear, isComingSoon);
                      var sThumb = (tv.coverImage && (tv.coverImage.extraLarge || tv.coverImage.large)) || result.posterUrl;
                      var streamEps = (tv.streamingEpisodes || []).slice();
                      var tvmEps = tvmazeEpisodesBySeason.get(sNum) || [];

                      var nextEp = tv.nextAiringEpisode ? tv.nextAiringEpisode.episode : null;
                      var airedCount = isComingSoon
                        ? 0
                        : isReleasing
                          ? (nextEp ? Math.max(0, nextEp - 1) : (streamEps.length || tvmEps.length))
                          : (tv.episodes || streamEps.length || tvmEps.length || 12);

                      var totalPlanned = tv.episodes || (isReleasing ? Math.max(airedCount + 1, streamEps.length) : airedCount);

                      var statusText = "";
                      var badgeText = null;

                      if (isComingSoon) {
                        var airHint = (tv.startDate && tv.startDate.year)
                          ? ("Airs " + formatAniDate(tv.startDate, sYear, false))
                          : "Release date TBA";
                        statusText = "⏳ Coming Soon · " + airHint;
                        badgeText = "⏳ Coming Soon";
                      } else if (isReleasing) {
                        var countdown = tv.nextAiringEpisode ? formatCountdown(tv.nextAiringEpisode.timeUntilAiring) : null;
                        statusText = "🟢 Running at Ep " + airedCount + (tv.episodes ? (" / " + tv.episodes) : "") + (nextEp && countdown ? (" · Ep " + nextEp + " " + countdown) : "");
                        badgeText = "🟢 Running at Ep " + airedCount + (tv.episodes ? (" / " + tv.episodes) : "");
                      } else {
                        statusText = totalPlanned + " episodes";
                      }

                      aniSeasons.push({
                        seasonNumber: sNum,
                        releaseYear: sYear,
                        firstAirDate: sDate,
                        thumbnailUrl: sThumb,
                        statusText: statusText,
                        badgeText: badgeText,
                        isComingSoon: isComingSoon,
                        isReleasing: isReleasing,
                        airedCount: airedCount
                      });

                      var airScheduleMap = new Map();
                      var scheduleNodes = (tv.airingSchedule && tv.airingSchedule.nodes) || [];
                      scheduleNodes.forEach(function(sc) {
                        if (sc && sc.episode) airScheduleMap.set(sc.episode, sc);
                      });

                      if (!isComingSoon) {
                        var epLoopCount = Math.max(totalPlanned, streamEps.length, tvmEps.length, isReleasing && nextEp ? nextEp : 0);
                        for (var eIdx = 0; eIdx < epLoopCount; eIdx++) {
                          var epNum = eIdx + 1;
                          var streamEp = streamEps[eIdx] || null;
                          var tvmEp = tvmEps.find(function(x) { return x.episodeNumber === epNum; }) || null;
                          var scItem = airScheduleMap.get(epNum);
                          var epAirTs = scItem ? scItem.airingAt : (epNum === nextEp && tv.nextAiringEpisode ? tv.nextAiringEpisode.airingAt : null);

                          var cleanEpTitle = (tvmEp && tvmEp.title) || ("Episode " + epNum);
                          if (streamEp && streamEp.title) {
                            cleanEpTitle = streamEp.title.replace(/^Episode\\s*\\d+\\s*[-:]\\s*/i, "").trim() || streamEp.title;
                          }

                          var cleanArriveDate = (tvmEp && tvmEp.arriveDate) || formatArriveDate(tvmEp && tvmEp.airDate, epAirTs, sDate, eIdx);

                          var isUpcomingEp = isReleasing && nextEp != null && epNum >= nextEp;
                          var epAirStatus = null;
                          if (isUpcomingEp) {
                            if (epNum === nextEp && tv.nextAiringEpisode) {
                              epAirStatus = "⏳ Next Ep · Airs " + formatCountdown(tv.nextAiringEpisode.timeUntilAiring);
                            } else {
                              epAirStatus = "⏳ Upcoming episode";
                            }
                          } else if (isReleasing && epNum === airedCount) {
                            epAirStatus = "🟢 Latest aired";
                          }

                          aniEpisodes.push({
                            id: tv.id * 1000 + epNum,
                            seasonNumber: sNum,
                            episodeNumber: epNum,
                            title: cleanEpTitle,
                            arriveDate: cleanArriveDate,
                            airDate: (tvmEp && tvmEp.airDate) || sDate,
                            runtimeMinutes: (tvmEp && tvmEp.runtimeMinutes) || tv.duration || 24,
                            airStatus: epAirStatus,
                            isUpcoming: isUpcomingEp,
                            sourceUrl: (streamEp && streamEp.url) || (tvmEp && tvmEp.sourceUrl) || tv.siteUrl || null,
                            thumbnailUrl: (streamEp && streamEp.thumbnail) || (tvmEp && tvmEp.thumbnailUrl) || sThumb,
                            localFileName: null
                          });
                        }
                      }
                    });

                    if (aniSeasons.length > 0) result.seasons = aniSeasons;
                    if (aniEpisodes.length > 0) result.episodes = aniEpisodes;

                    var nonTvNodes = franchiseNodes.filter(function(n) {
                      return ["MOVIE", "OVA", "SPECIAL", "ONA", "TV_SHORT"].indexOf(n.format) !== -1 && tvNodes.indexOf(n) === -1;
                    });

                    result.relatedMedia = nonTvNodes.map(function(n, idx) {
                      var isUnrel = n.status === "NOT_YET_RELEASED";
                      var isRel = n.status === "RELEASING";
                      var rYear = n.seasonYear || (n.startDate && n.startDate.year) || null;
                      var rDate = formatAniDate(n.startDate, rYear, isUnrel);
                      var cType = (n.format === "OVA" || n.format === "ONA")
                        ? "ova"
                        : (n.format === "SPECIAL" || n.format === "TV_SHORT")
                          ? "special"
                          : "movie";
                      var relLabel = relationMap[n.id] || "Related";
                      var statusPrefix = isUnrel
                        ? "⏳ Coming Soon"
                        : isRel
                          ? ("🟢 Running" + (n.nextAiringEpisode ? (" at Ep " + Math.max(1, n.nextAiringEpisode.episode - 1)) : ""))
                          : null;
                      // Episode count for OVAs/Specials: from AniList or streamingEpisodes
                      var epCount = n.episodes || ((n.streamingEpisodes && n.streamingEpisodes.length) || 1);
                      var epsArr = [];
                      if (cType === "ova" || cType === "special") {
                        for (var ei = 1; ei <= epCount; ei++) {
                          var se = (n.streamingEpisodes || []).find(function(s){ return s.episode === ei; });
                          epsArr.push({
                            number: ei,
                            title: (se && se.title) || ("OVA Episode " + ei),
                            thumbnail: (se && se.thumbnail) || null,
                            runtime: n.duration || null
                          });
                        }
                      }
                      return {
                        id: n.id || (Date.now() + idx + 1),
                        contentType: cType,
                        title: (n.title && (n.title.english || n.title.romaji)) || "Related Title",
                        releaseYear: rYear,
                        releaseDate: rDate,
                        relation: statusPrefix ? (relLabel + " · " + statusPrefix) : relLabel,
                        statusText: statusPrefix,
                        rating: n.averageScore ? Number((n.averageScore / 10).toFixed(1)) : null,
                        ratingScale: 10,
                        synopsis: cleanHtml(n.description) || (isUnrel ? "Upcoming release — announced on AniList." : ""),
                        thumbnailUrl: (n.coverImage && (n.coverImage.extraLarge || n.coverImage.large)) || result.posterUrl,
                        sourceUrl: n.siteUrl || null,
                        episodeCount: epCount,
                        episodes: epsArr,
                        anilistId: n.id || null
                      };
                    });
                  }
                }
              } catch (e) {}

              // Fetch AnimeThemes trailer URL (cached on collection)
              try {
                var trailerAnilistId = result.anilistId || null;
                if (!trailerAnilistId && result.relatedMedia) {
                  var rm = result.relatedMedia.find(function(x){ return x.anilistId; });
                  if (rm) trailerAnilistId = rm.anilistId;
                }
                if (typeof fetchTrailerUrl === 'function') {
                  var tUrl = await fetchTrailerUrl(trailerAnilistId, title);
                  if (tUrl) result.trailerVideoUrl = tUrl;
                }
              } catch (te) {}

              return result;
            }

            function attachFilesToCollection(col, newFiles) {
              if (!col.files) col.files = [];
              var existingKeys = new Set(
                col.files.map(function(f) {
                  return String(f.relativePath || f.fileName || "").replace(/\\\\/g, "/").toLowerCase();
                })
              );

              newFiles.forEach(function(nf) {
                var key = String(nf.relativePath || nf.fileName || "").replace(/\\\\/g, "/").toLowerCase();
                if (!existingKeys.has(key)) {
                  existingKeys.add(key);
                  nf.sortOrder = col.files.length + 1;
                  col.files.push(nf);
                }
              });

              if (col.kind === "series") {
                if (!col.seasons) col.seasons = [];
                if (!col.episodes) col.episodes = [];

                col.files.forEach(function(f) {
                  if (f.mediaKind !== "episode" || f.seasonNumber == null) return;
                  var hasSeason = col.seasons.some(function(s) { return s.seasonNumber === f.seasonNumber; });
                  if (!hasSeason) {
                    col.seasons.push({
                      seasonNumber: f.seasonNumber,
                      releaseYear: f.releaseYear || col.year || new Date().getFullYear(),
                      firstAirDate: null,
                      thumbnailUrl: col.posterUrl,
                      statusText: null,
                      badgeText: null,
                      isComingSoon: false
                    });
                  }
                  var matchEp = col.episodes.find(function(ep) {
                    return ep.seasonNumber === f.seasonNumber && ep.episodeNumber === f.episodeNumber;
                  });
                  if (matchEp) {
                    matchEp.localFileName = f.fileName;
                  } else if (f.episodeNumber != null) {
                    col.episodes.push({
                      id: col.id * 10000 + f.seasonNumber * 100 + f.episodeNumber,
                      seasonNumber: f.seasonNumber,
                      episodeNumber: f.episodeNumber,
                      title: f.displayTitle || ("Episode " + f.episodeNumber),
                      arriveDate: null,
                      airDate: null,
                      runtimeMinutes: 24,
                      sourceUrl: null,
                      thumbnailUrl: col.posterUrl,
                      localFileName: f.fileName
                    });
                  }
                });
                col.seasonCount = col.seasons.length;
              }
            }

            async function handleAction(action, args) {
              var db = loadDB();
              args = args || {};

              if (action === "listCollections") {
                var list = db.collections.slice();
                // Hide Discover-cached items from Home unless hearted or has local files
                if (!args.includeDiscover) {
                  list = list.filter(function(c) {
                    if (c.discoverCached && !c.isWatchlist && (!c.files || c.files.length === 0)) return false;
                    return true;
                  });
                }
                if (args.kind && args.kind !== "all" && args.kind !== "history") {
                  list = list.filter(function(c) { return c.kind === args.kind; });
                }
                if (args.query) {
                  var q = String(args.query).toLowerCase();
                  list = list.filter(function(c) { return c.title.toLowerCase().indexOf(q) !== -1; });
                }
                return { collections: list };
              }

              if (action === "listContinueWatching") {
                var cw = [];
                var seenCol = {}; // dedup: one card per collection (most recent wins)
                db.collections.forEach(function(col) {
                  (col.files || []).forEach(function(f) {
                    if ((f.positionSeconds > 0.5) || (f.lastWatchedAt && f.lastWatchedAt > 0) || f.completed) {
                      var epMatch = (col.episodes || []).find(function(e) {
                        return e.seasonNumber === f.seasonNumber && e.episodeNumber === f.episodeNumber;
                      });
                      var thumb = (epMatch && epMatch.thumbnailUrl) || col.posterUrl;
                      var titleText = (epMatch && epMatch.title) ? epMatch.title : f.displayTitle;
                      var dur = f.durationSeconds > 0 ? f.durationSeconds : 1440;
                      var pct = f.completed ? 100 : Math.min(99, Math.max(5, (f.positionSeconds / dur) * 100));

                      cw.push({
                        collectionId: col.id,
                        collectionTitle: col.title,
                        mediaFileId: f.id,
                        fileName: f.fileName,
                        displayTitle: titleText,
                        posterUrl: thumb,
                        seasonNumber: f.seasonNumber,
                        episodeNumber: f.episodeNumber,
                        contentType: f.contentType,
                        positionSeconds: f.positionSeconds || 0,
                        durationSeconds: f.durationSeconds || 0,
                        completed: Boolean(f.completed),
                        lastWatchedAt: f.lastWatchedAt || 1,
                        progressPercent: pct,
                        isOnline: false
                      });
                    }
                  });
                });
                // Merge online watch history (__online_history_v1)
                try {
                  var ohRaw = localStorage.getItem('__online_history_v1');
                  var ohList = ohRaw ? JSON.parse(ohRaw) : [];
                  if (Array.isArray(ohList)) {
                    ohList.forEach(function(h) {
                      if (!h || !h.lastWatchedAt) return;
                      // Map to native collection via anilistId->collection or title match
                      var col = null;
                      var hKey = normalizeTitleKey(h.title || '');
                      // Try to find matching collection by title
                      col = db.collections.find(function(c){ return normalizeTitleKey(c.title) === hKey; });
                      // If online entry was created via openOnlineAsNative, it should have a collection
                      var dur2 = h.durationSeconds > 0 ? h.durationSeconds : 1440;
                      var pct2 = Math.min(99, Math.max(5, ((h.positionSeconds || 0) / dur2) * 100));
                      cw.push({
                        collectionId: col ? col.id : ('online:' + (h.animeId || h.anilistId || '')),
                        collectionTitle: h.title || 'Unknown',
                        mediaFileId: null,
                        fileName: null,
                        displayTitle: h.epTitle || ('Episode ' + (h.ep || '')),
                        posterUrl: h.poster || (col && col.posterUrl) || null,
                        seasonNumber: 1,
                        episodeNumber: h.ep || 1,
                        contentType: h.kind || 'series',
                        positionSeconds: h.positionSeconds || 0,
                        durationSeconds: h.durationSeconds || 0,
                        completed: false,
                        lastWatchedAt: h.lastWatchedAt,
                        progressPercent: pct2,
                        isOnline: true,
                        onlineAnilistId: h.anilistId,
                        onlineAnimeId: h.animeId,
                        onlineAnime: h.anime,
                        onlineEpisodes: h.episodes
                      });
                    });
                  }
                } catch(e) {}
                // Strict dedup: one card per collectionId, keep most recent lastWatchedAt
                var deduped = {};
                cw.forEach(function(item){
                  var k = String(item.collectionId);
                  if (!deduped[k] || (item.lastWatchedAt || 0) > (deduped[k].lastWatchedAt || 0)) {
                    deduped[k] = item;
                  }
                });
                cw = Object.keys(deduped).map(function(k){ return deduped[k]; });
                cw.sort(function(a, b) {
                  return (b.lastWatchedAt || 0) - (a.lastWatchedAt || 0);
                });
                return { items: cw.slice(0, args.limit || 50) };
              }

              if (action === "getCollection") {
                var found = db.collections.find(function(c) { return Number(c.id) === Number(args.id); });
                return { collection: found || null };
              }

              if (action === "addCollection") {
                var kind = args.kind || "series";
                var cleanTitle = String(args.title || "").trim();
                var titleKey = normalizeTitleKey(cleanTitle);
                var rawFiles = args.files || [];

                var seenIncoming = new Set();
                var uniqueRawFiles = [];
                rawFiles.forEach(function(f) {
                  var k = String(f.relativePath || f.fileName || "").replace(/\\\\/g, "/").toLowerCase();
                  if (k && !seenIncoming.has(k)) {
                    seenIncoming.add(k);
                    uniqueRawFiles.push(f);
                  }
                });

                var parsedFiles = uniqueRawFiles.map(function(f, idx) {
                  return parseFileEntry(f, kind, idx, db.nextFileId++);
                });

                var existingCol = db.collections.find(function(c) {
                  return normalizeTitleKey(c.title) === titleKey && c.kind === kind;
                }) || db.collections.find(function(c) {
                  return normalizeTitleKey(c.title) === titleKey;
                });

                if (existingCol) {
                  if (args.posterDataBase64) {
                    existingCol.posterUrl = "data:" + (args.posterMimeType || "image/jpeg") + ";base64," + args.posterDataBase64;
                  }
                  attachFilesToCollection(existingCol, parsedFiles);
                  saveDB(db);
                  return { collection: existingCol };
                }

                var id = db.nextId++;
                var meta = await lookupAllMetadata(cleanTitle, kind, args.year);
                var posterUrl = args.posterDataBase64
                  ? ("data:" + (args.posterMimeType || "image/jpeg") + ";base64," + args.posterDataBase64)
                  : meta.posterUrl;

                var seasons = meta.seasons;
                var episodes = meta.episodes;

                if (kind === "series") {
                  if (seasons.length === 0) {
                    seasons = [{
                      seasonNumber: 1,
                      releaseYear: args.year || meta.year || new Date().getFullYear(),
                      firstAirDate: null,
                      thumbnailUrl: posterUrl,
                      statusText: "12 episodes",
                      badgeText: null,
                      isComingSoon: false
                    }];
                  }
                  if (episodes.length === 0 && !seasons[0].isComingSoon) {
                    var count = Math.max(parsedFiles.length, 12);
                    for (var i = 0; i < count; i++) {
                      var epNum = i + 1;
                      var mf = parsedFiles.find(function(x) { return x.episodeNumber === epNum; });
                      episodes.push({
                        id: id * 1000 + epNum,
                        seasonNumber: 1,
                        episodeNumber: epNum,
                        title: mf ? mf.displayTitle : ("Episode " + epNum),
                        arriveDate: null,
                        airDate: null,
                        runtimeMinutes: 24,
                        sourceUrl: null,
                        thumbnailUrl: posterUrl,
                        localFileName: mf ? mf.fileName : null
                      });
                    }
                  }
                }

                var newCol = {
                  id: id,
                  title: cleanTitle,
                  kind: kind,
                  year: args.year || meta.year || new Date().getFullYear(),
                  posterUrl: posterUrl,
                  rating: meta.rating,
                  ratingScale: meta.ratingScale,
                  ratingSource: meta.ratingSource,
                  sourceUrl: meta.sourceUrl,
                  synopsis: meta.synopsis || "Local media collection ready to play.",
                  genres: meta.genres,
                  seasonCount: kind === "series" ? seasons.length : 0,
                  metadataStatus: "complete",
                  metadataNote: null,
                  createdAt: new Date().toISOString(),
                  seasons: seasons,
                  episodes: episodes,
                  relatedMedia: meta.relatedMedia,
                  files: [],
                  reviews: meta.reviews,
                  // Watchlist: Discover-opened items hidden from Home unless hearted
                  isWatchlist: args.isWatchlist !== undefined ? args.isWatchlist : (window.__discoverOpen ? false : true),
                  discoverCached: window.__discoverOpen ? true : false,
                  anilistId: meta.anilistId || null,
                  trailerVideoUrl: meta.trailerVideoUrl || null
                };

                attachFilesToCollection(newCol, parsedFiles);
                db.collections.unshift(newCol);
                saveDB(db);
                return { collection: newCol };
              }

              if (action === "updateArtwork") {
                var col = db.collections.find(function(c) { return Number(c.id) === Number(args.collectionId); });
                if (!col) return { ok: false, message: "Collection not found" };
                var dataUrl = "data:" + (args.imageMimeType || "image/jpeg") + ";base64," + args.imageDataBase64;
                if (args.target === "collection") {
                  col.posterUrl = dataUrl;
                } else if (args.target === "episode") {
                  var ep = (col.episodes || []).find(function(e) { return Number(e.id) === Number(args.episodeId); });
                  if (ep) ep.thumbnailUrl = dataUrl;
                } else if (args.target === "season") {
                  var s = (col.seasons || []).find(function(x) { return Number(x.seasonNumber) === Number(args.seasonNumber); });
                  if (s) s.thumbnailUrl = dataUrl;
                }
                saveDB(db);
                return { ok: true, message: "Updated" };
              }

              if (action === "updatePlaybackProgress") {
                var colP = db.collections.find(function(c) { return Number(c.id) === Number(args.collectionId); });
                if (colP) {
                  var fl = (colP.files || []).find(function(x) { return Number(x.id) === Number(args.mediaFileId); });
                  if (fl) {
                    fl.positionSeconds = args.positionSeconds || 0;
                    fl.durationSeconds = args.durationSeconds || 0;
                    fl.completed = Boolean(args.completed);
                    fl.lastWatchedAt = Date.now();
                    saveDB(db);
                  }
                }
                return { ok: true };
              }

              if (action === "getOnlineAvailability") {
                // Anime SUB/DUB streaming via the Media Player backend API.
                // Returns one "Watch now" row; clicks are intercepted and open
                // the in-app anime player (search -> episodes -> HLS + audio switch).
                var colA = db.collections.find(function(c) { return Number(c.id) === Number(args.collectionId); });
                // Prioritize args.title (full Movie/OVA title) over parent series title
                var cleanTitle = (args.title && String(args.title).trim()) ? String(args.title).trim() : (colA ? colA.title : "");
                var epNum = 0;
                var mEp = String(args.itemKey || "").match(/episode-\d+-(\d+)/);
                if (mEp) epNum = parseInt(mEp[1], 10);
                // Detect content type from itemKey: related-ova-*, related-movie-*, or movie
                var cType = "series";
                var ik = String(args.itemKey || "").toLowerCase();
                if (ik.indexOf("related-ova-") === 0 || ik.indexOf("ova") >= 0) cType = "ova";
