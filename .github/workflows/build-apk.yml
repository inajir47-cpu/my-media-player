                  if (window.awToast) awToast('Searching for \u201C' + title + '\u201D\u2026');
                }
                // Smart search: try full title, then fallback to simplified variants
                function searchWithFallback(titles, idx) {
                  if (idx >= titles.length) {
                    setStatus(errBox('No anime found for \\u201C' + title + '\\u201D.'));
                    return;
                  }
                  var qt = titles[idx];
                  apiGet('/api/anime/search?q=' + encodeURIComponent(qt)).then(function (d) {
                    var res = (d && d.results) || [];
                    if (!res.length && idx + 1 < titles.length) {
                      setStatus('<span class="spinner"></span>Trying \\u201C' + esc(titles[idx+1]) + '\\u201D\\u2026');
                      searchWithFallback(titles, idx + 1);
                      return;
                    }
                    lastResults = res; lastQuery = qt;
                    if (!res.length) { setStatus(errBox('No anime found for \\u201C' + title + '\\u201D.')); return; }
                    handleSearchResults(res, qt);
                  }, function (err) { setStatus(errBox(err.message)); });
                }
                function buildFallbackTitles(t) {
                  var out = [t];
                  // Strip punctuation-heavy subtitles: "KONOSUBA -God's blessing...: Choker!" -> "KONOSUBA Choker"
                  var simple = t.replace(/[-–—:;!?'".()[\]]/g, ' ').replace(/\s+/g, ' ').trim();
                  if (simple && simple !== t) out.push(simple);
                  // Try "Series OVA" / "Series Movie" pattern
                  var m = t.match(/^(.+?)\s+[-–—]\s*(.+)$/);
                  if (m) {
                    var series = m[1].trim(), sub = m[2].trim();
                    if (cType === 'ova' || cType === 'special') {
                      out.push(series + ' OVA');
                      out.push(series + ' ' + sub.split(' ').slice(0, 3).join(' '));
                    } else if (cType === 'movie') {
                      out.push(series + ' Movie');
                    }
                    out.push(series);
                  }
                  return out.filter(function(x, i){ return out.indexOf(x) === i; });
                }
                function handleSearchResults(res, qt) {
                  var pick = res[0];
                  // Direct mode: skip modal UI, resolve and play directly
                  if (directMode) {
                    apiGet('/api/anime/detail?animeId=' + encodeURIComponent(pick.animeId) + '&enrich=0').then(function (dd) {
                      var eps = (dd && dd.episodes) || [];
                      if (!eps.length) { if (window.awToast) awToast('No episodes found'); return; }
                      if (cType === 'ova' || cType === 'special') {
                        // Show native episode picker (simple overlay, not .aw-modal)
                        showDirectOvaPicker(pick, dd.anilistId || pick.anilistId, eps);
                      } else {
                        var want = ep || 1, target = null;
                        for (var i = 0; i < eps.length; i++) if (eps[i].number === want) target = eps[i].number;
                        if (target == null && eps.length) target = eps[0].number;
                        if (cType === 'movie' && res.length > 1) {
                          // Multiple movie matches: play first, user can use secret menu for others
                          if (window.awToast) awToast('Multiple matches, playing first');
                        }
                        playEpisode(pick, dd.anilistId || pick.anilistId, target, eps, { preferDub: true, format: dd.info && dd.info.format });
                      }
                    }, function (err) { if (window.awToast) awToast('Failed: ' + (err.message || 'network error')); });
                    return;
                  }
                  var b = body();
                  if (!b) return;
                  // For OVAs/Specials: show episode selector instead of auto-playing
                  if (cType === 'ova' || cType === 'special') {
                    b.innerHTML = '<div class="aw-status"><span class="spinner"></span>Found <b>' + esc(pick.title) + '</b> \\u2014 loading episodes\\u2026 ' +
                      '<button type="button" class="aw-link" id="awWrong">Wrong title? pick another</button></div>';
                    b.querySelector('#awWrong').onclick = function () { renderResultCards(res, ep || 0); };
                    apiGet('/api/anime/detail?animeId=' + encodeURIComponent(pick.animeId) + '&enrich=0').then(function (dd) {
                      var eps = (dd && dd.episodes) || [];
                      if (!eps.length) { setStatus(errBox('No episodes found for ' + pick.title + '.')); return; }
                      // Show manual episode selector for OVA
                      renderOvaEpisodePicker(pick, dd.anilistId || pick.anilistId, eps, res);
                    }, function (err) { setStatus(errBox(err.message)); });
                    return;
                  }
                  // For Movies and Series: auto-play (movies play directly, series plays requested ep)
                  b.innerHTML = '<div class="aw-status"><span class="spinner"></span>Found <b>' + esc(pick.title) + '</b> \\u2014 loading episodes\\u2026 ' +
                    '<button type="button" class="aw-link" id="awWrong">Wrong title? pick another</button></div>';
                  b.querySelector('#awWrong').onclick = function () { renderResultCards(res, ep || 0); };
                  apiGet('/api/anime/detail?animeId=' + encodeURIComponent(pick.animeId) + '&enrich=0').then(function (dd) {
                    var eps = (dd && dd.episodes) || [];
                    var want = ep || 1, target = null, i;
                    for (i = 0; i < eps.length; i++) if (eps[i].number === want) target = eps[i].number;
                    if (target == null && eps.length) target = eps[0].number;
                    if (target == null) { setStatus(errBox('No episodes found for ' + pick.title + '.')); return; }
                    // For movies with multiple matches, let user pick if more than 1 movie result
                    if (cType === 'movie' && res.length > 1) {
