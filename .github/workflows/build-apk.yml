                main.style.display = 'none';
                disc.style.display = 'block';
                
                disc.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
                  '<h2 style="margin:0;font-size:20px;">Discover Dubbed Anime</h2>' +
                  '<button id="disc-refresh" style="background:#7c3aed;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;">↻ Refresh</button>' +
                  '</div><div id="disc-genres"><p>Loading dubbed anime...</p></div>';
                
                document.getElementById('disc-refresh').onclick = function() {
                  localStorage.removeItem(CACHE_KEY);
                  renderDiscoverFeed(true);
                };
                
                renderDiscoverFeed(false);
              }
              
              // Load Hentai row from hanime index
              async function loadHentaiRow() {
                var carousel = document.getElementById('disc-hentai-carousel');
                if (!carousel) return;
                try {
                  var idx = await hvGetIndex();
                  var items = (idx || []).slice(0, 15);
                  if (!items.length) {
                    carousel.innerHTML = '<p style="color:#888;">No hentai available</p>';
