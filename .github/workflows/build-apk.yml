              }
              
              // View All with infinite scroll pagination
              var genrePageState = {};
              async function showGenreGrid(genreName, feed) {
                var disc = document.getElementById('discover-view');
                var genreDef = GENRES.find(function(g){ return g.name === genreName; });
                var items = (feed && feed[genreName]) || [];
                genrePageState = { genre: genreDef, page: 1, hasMore: true, loading: false, allItems: items.slice() };
                
                disc.innerHTML = '<div style="padding:16px;" id="disc-grid-wrap">' +
                  '<button id="disc-back" style="background:none;border:none;color:#7c3aed;cursor:pointer;font-size:15px;margin-bottom:16px;">‹ Back to Discover</button>' +
                  '<h2 style="margin:0 0 16px 0;">' + genreName + ' - All Dubbed</h2>' +
                  '<div id="disc-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;"></div>' +
                  '<div id="disc-loadmore" style="text-align:center;padding:20px;"><button id="disc-more-btn" style="background:#7c3aed;color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;">Load More</button></div>' +
                  '</div>';
                
                document.getElementById('disc-back').onclick = function(){ renderDiscover(); };
                
                function renderGridItems(newItems) {
                  var grid = document.getElementById('disc-grid');
                  newItems.forEach(function(item){
                    var card = document.createElement('div');
                    card.className = 'disc-card';
                    card.setAttribute('data-title', item.title);
                    card.style.cssText = 'cursor:pointer;';
                    card.innerHTML = '<div style="position:relative;">' +
                      '<img src="' + item.poster + '" style="width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;" loading="lazy">' +
                      '<span style="position:absolute;top:6px;left:6px;background:#7c3aed;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;">' + item.dubLang + ' DUB</span>' +
                      '<button class="disc-heart" data-title="' + item.title.replace(/"/g, '&quot;') + '" style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:18px;width:32px;height:32px;border-radius:50%;cursor:pointer;">🤍</button>' +
                      '</div><div style="font-size:12px;margin-top:6px;">' + item.title + '</div>';
                    card.onclick = function(e){
                      if (e.target.classList.contains('disc-heart')) return;
                      openDiscoverDetail(item);
                    };
                    grid.appendChild(card);
                  });
                  // Wire hearts
                  grid.querySelectorAll('.disc-heart').forEach(function(hb){
