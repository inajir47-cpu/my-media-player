                      result.posterUrl = result.posterUrl || (show.image && (show.image.original || show.image.medium)) || null;
                      result.synopsis = result.synopsis || cleanHtml(show.summary);
                      if (show.rating && show.rating.average) {
                        result.rating = show.rating.average;
                        result.ratingScale = 10;
                        result.ratingSource = "TVmaze";
                      }
                      result.sourceUrl = show.url || result.sourceUrl;
                      result.genres = (show.genres && show.genres.length > 0) ? show.genres : result.genres;
                      var rawSeasons = (show._embedded && show._embedded.seasons) || [];
                      result.seasons = rawSeasons.map(function(s) {
                        return {
                          seasonNumber: s.number || 1,
