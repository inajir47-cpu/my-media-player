                  body: JSON.stringify({ query: searchQuery, variables: { search: title } })
                });
                var j1 = await r1.json();
                var rootMedia = j1 && j1.data && j1.data.Media;

                if (rootMedia) {
                  result.posterUrl = (rootMedia.coverImage && (rootMedia.coverImage.extraLarge || rootMedia.coverImage.large)) || null;
                  result.rating = rootMedia.averageScore ? Number((rootMedia.averageScore / 10).toFixed(1)) : null;
                  result.ratingScale = rootMedia.averageScore ? 10 : null;
                  result.ratingSource = "AniList";
                  result.sourceUrl = rootMedia.siteUrl || null;
                  result.synopsis = cleanHtml(rootMedia.description);
                  result.genres = rootMedia.genres || [];
                  result.year = result.year || rootMedia.seasonYear || (rootMedia.startDate && rootMedia.startDate.year) || null;

                  var revNodes = (rootMedia.reviews && rootMedia.reviews.nodes) || [];
                  result.reviews = revNodes.map(function(rv, idx) {
                    return {
                      id: Date.now() + 500 + idx,
                      reviewType: idx % 2 === 0 ? "critic" : "audience",
                      sourceName: "AniList",
                      excerpt: rv.summary || "Highly recommended watch.",
                      author: (rv.user && rv.user.name) || "AniList Reviewer",
                      sourceUrl: rv.siteUrl || rootMedia.siteUrl || "https://anilist.co",
                      fetchedAt: new Date().toISOString()
                    };
                  });

                  var idSet = new Set([rootMedia.id]);
                  var relationMap = {};
                  relationMap[rootMedia.id] = "Main story";

                  function walkEdges(edges) {
                    if (!edges) return;
                    edges.forEach(function(edge) {
                      var rel = edge && edge.relationType;
                      var node = edge && edge.node;
                      if (!node || node.type !== "ANIME" || VALID_RELATIONS.indexOf(rel) === -1) return;
                      if (!idSet.has(node.id)) {
                        idSet.add(node.id);
                        relationMap[node.id] = rel.replace(/_/g, " ");
                      }
                      if (node.relations && node.relations.edges) {
                        walkEdges(node.relations.edges);
                      }
                    });
                  }
                  walkEdges(rootMedia.relations && rootMedia.relations.edges);

                  var allIds = Array.from(idSet).slice(0, 45);
                  var batchQuery = \`
                    query ($ids: [Int]) {
                      Page(perPage: 50) {
                        media(id_in: $ids, type: ANIME) {
                          id
                          title { english romaji }
                          description(asHtml: false)
                          seasonYear
                          startDate { year month day }
                          format
                          status
                          episodes
                          duration
                          averageScore
                          siteUrl
                          nextAiringEpisode { episode airingAt timeUntilAiring }
                          airingSchedule(perPage: 50) { nodes { episode airingAt timeUntilAiring } }
                          coverImage { extraLarge large }
                          streamingEpisodes { title thumbnail url }
                          relations {
                            edges {
                              relationType(version: 2)
                              node {
                                id type format status
                                title { english romaji }
                                description(asHtml: false)
                                seasonYear
                                startDate { year month day }
                                episodes
                                duration
                                averageScore
                                siteUrl
                                nextAiringEpisode { episode airingAt timeUntilAiring }
                                coverImage { extraLarge large }
                              }
                            }
                          }
