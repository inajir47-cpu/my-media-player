              private static final java.util.Map<String, String> proxyCookieJar = new java.util.HashMap<String, String>();

              // Share cookies across subdomains of the same registrable domain
              // (e.g. htv_csrf_proof set by ct.hanime.tv must reach auth.hanime.tv).
              private String proxyCookieKey(String host) {
                  String[] labels = host.split("\\.");
                  if (labels.length >= 2) return labels[labels.length - 2] + "." + labels[labels.length - 1];
                  return host;
              }

              private String proxyReadLine(java.io.InputStream in) throws java.io.IOException {
                  StringBuilder sb = new StringBuilder();
                  int b;
                  while ((b = in.read()) != -1) {
                      if (b == '\n') break;
                      if (b != '\r') sb.append((char) b);
                  }
                  if (b == -1 && sb.length() == 0) return null;
                  return sb.toString();
              }

              private void handleProxyConnection(Socket client) {
                  try {
                      client.setSoTimeout(30000);
                      java.io.InputStream rawIn = client.getInputStream();
                      String requestLine = proxyReadLine(rawIn);
                      if (requestLine == null) { try { client.close(); } catch (Exception ignored) {} return; }
                      String[] parts = requestLine.split(" ");
                      if (parts.length < 2) { sendSimple(client, 400, "Bad Request"); try { client.close(); } catch (Exception ignored) {} return; }
                      String method = parts[0];
                      java.util.Map<String, String> reqHeaders = new java.util.LinkedHashMap<String, String>();
                      String line;
                      while ((line = proxyReadLine(rawIn)) != null && !line.isEmpty()) {
                          int colon = line.indexOf(':');
                          if (colon > 0) reqHeaders.put(line.substring(0, colon).trim(), line.substring(colon + 1).trim());
                      }
                      if (method.equals("OPTIONS")) {
                          sendOptions(client);
                          try { client.close(); } catch (Exception ignored) {} return;
                      }
                      boolean isPost = method.equals("POST");
                      if (!method.equals("GET") && !isPost) { sendSimple(client, 405, "Method Not Allowed"); try { client.close(); } catch (Exception ignored) {} return; }
                      String path = parts[1];
                      String upstream = null;
                      int q = path.indexOf("?u=");
                      if ((path.startsWith("/r") || path.startsWith("/p")) && q >= 0) {
                          String enc = path.substring(q + 3);
                          int amp = enc.indexOf('&');
                          if (amp >= 0) enc = enc.substring(0, amp);
                          try { upstream = URLDecoder.decode(enc, "UTF-8"); } catch (Exception ignored) {}
                      }
                      if (upstream == null || !(upstream.startsWith("http://") || upstream.startsWith("https://"))) {
                          sendSimple(client, 400, "Bad Request");
                          try { client.close(); } catch (Exception ignored) {} return;
                      }
                      byte[] postBody = null;
                      if (isPost) {
                          int contentLen = 0;
                          for (java.util.Map.Entry<String, String> e : reqHeaders.entrySet()) {
                              if (e.getKey().equalsIgnoreCase("Content-Length")) {
                                  try { contentLen = Integer.parseInt(e.getValue().trim()); } catch (Exception ignored) {}
                              }
                          }
                          if (contentLen > 0 && contentLen < 8 * 1024 * 1024) {
                              postBody = new byte[contentLen];
                              int off = 0;
                              while (off < contentLen) {
                                  int n = rawIn.read(postBody, off, contentLen - off);
                                  if (n <= 0) break;
                                  off += n;
                              }
                          }
                      }
                      forwardUpstream(client, method, upstream, reqHeaders, postBody);
                      try { client.close(); } catch (Exception ignored) {}
                  } catch (Exception e) {
                      try { client.close(); } catch (Exception ignored) {}
                  }
              }

              private void sendOptions(Socket client) {
                  try {
                      String head = "HTTP/1.1 200 OK\r\n" +
                          "Access-Control-Allow-Origin: *\r\n" +
                          "Access-Control-Allow-Methods: GET, POST, OPTIONS\r\n" +
                          "Access-Control-Allow-Headers: *\r\n" +
                          "Content-Length: 0\r\n" +
                          "Connection: close\r\n\r\n";
                      OutputStream out = client.getOutputStream();
                      out.write(head.getBytes("UTF-8"));
                      out.flush();
                  } catch (Exception ignored) {}
              }

              private void sendSimple(Socket client, int status, String text) {
                  try {
                      byte[] body = text.getBytes("UTF-8");
                      String head = "HTTP/1.1 " + status + " " + text + "\r\n" +
                          "Content-Type: text/plain\r\n" +
                          "Content-Length: " + body.length + "\r\n" +
                          "Access-Control-Allow-Origin: *\r\n" +
                          "Connection: close\r\n\r\n";
                      OutputStream out = client.getOutputStream();
                      out.write(head.getBytes("UTF-8"));
                      out.write(body);
                      out.flush();
                  } catch (Exception ignored) {}
              }

              private boolean proxyHasHeader(java.util.Map<String, String> headers, String name) {
