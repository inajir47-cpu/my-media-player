            }

            function formatAniDate(sd, fallbackYear, isUnreleased) {
              if (sd && sd.year) {
                var m = String(sd.month || (isUnreleased ? 12 : 1)).padStart(2, "0");
                var d = String(sd.day || (isUnreleased ? 28 : 1)).padStart(2, "0");
                return sd.year + "-" + m + "-" + d;
              }
              if (fallbackYear) return fallbackYear + (isUnreleased ? "-12-28" : "-06-15");
              return null;
            }

            // Converts YYYY-MM-DD or unix timestamps into "Sep 10", "Jan 14", etc.
            function formatArriveDate(dateStr, airingAtTs, seasonStartDateStr, epIndex) {
              if (airingAtTs && airingAtTs > 0) {
                try {
                  var d = new Date(airingAtTs * 1000);
                  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
                } catch(e) {}
              }
              if (dateStr) {
                try {
                  var parts = String(dateStr).split("-");
                  if (parts.length >= 3) {
                    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
                    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
                  }
                } catch(e) {}
              }
              if (seasonStartDateStr) {
                try {
                  var parts = String(seasonStartDateStr).split("-");
                  if (parts.length >= 3) {
                    var base = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
                    var epDate = new Date(base.getTime() + (epIndex || 0) * 7 * 86400000);
                    return epDate.toLocaleDateString("en-US", { month: "short", day: "numeric" });
                  }
                } catch(e) {}
              }
              return null;
            }

            function formatCountdown(seconds) {
              if (!seconds || seconds <= 0) return "soon";
              var days = Math.floor(seconds / 86400);
              var hours = Math.floor((seconds % 86400) / 3600);
              if (days > 0) return "in " + days + "d " + hours + "h";
              if (hours > 0) return "in " + hours + "h";
              var mins = Math.max(1, Math.floor((seconds % 3600) / 60));
