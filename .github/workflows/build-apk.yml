name: Build Original Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Inject Kotlin, Unpack & Compile APK
        run: |
          mkdir -p original-app
          unzip -o real-media-player.zip -d original-app
          cd original-app
          npm install
          npx vite build
          npx cap sync android || true
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          
          cd android
          # 1. Add Kotlin plugin to root build.gradle classpath if missing
          if ! grep -q "kotlin-gradle-plugin" build.gradle; then
            sed -i '/classpath.*gradle:/a \        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"' build.gradle
          fi

          # 2. Apply Kotlin plugin to app/build.gradle
          if ! grep -q "kotlin-android" app/build.gradle; then
            sed -i '1s/^/apply plugin: "kotlin-android"\n/' app/build.gradle
          fi

          # 3. Align Java / JVM target to 21
          find . -name "build.gradle" -exec sed -i 's/VERSION_17/VERSION_21/g' {} +
          find . -name "*.gradle" -exec sed -i 's/jvmTarget = "17"/jvmTarget = "21"/g' {} +

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Original APK
        uses: actions/upload-artifact@v4
        with:
          name: Original-Media-Player-APK
          path: "**/android/app/build/outputs/apk/**/*.apk"
