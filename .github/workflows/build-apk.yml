                if (disc) disc.style.display = 'none';
                if (main) main.style.display = '';
                if (window.__discBtn) window.__discBtn.classList.remove('active');
              }
              
              // Inject Discover tab after Home
              function injectDiscoverTab() {
                var nav = document.querySelector('.topbar nav');
                if (!nav || nav.querySelector('[data-tab="discover"]')) return;
                
                var buttons = nav.querySelectorAll('button');
                if (!buttons.length) return;
                
                var discBtn = document.createElement('button');
                discBtn.textContent = 'Discover';
                discBtn.setAttribute('data-tab', 'discover');
                // Copy class but NOT inline styles (avoids hardcoded white active bg)
                discBtn.className = buttons[0].className.replace(/\bactive\b/g, '').trim();
                
                var tapCount = 0, tapTimer = null;
                discBtn.onclick = function(){
                  tapCount++;
                  if (tapTimer) clearTimeout(tapTimer);
