name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract Zip, Replace Files & Build APK
        run: |
          unzip -o media-player-source.zip
          cp -f api.ts frontend/src/api.ts
          cp -f Library.tsx frontend/src/pages/Library.tsx
          cd frontend
          npm install
          npx vite build
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "My Media Player" "com.mymediaplayer.tablet" --web-dir dist
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Media-Player-APK
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
          
