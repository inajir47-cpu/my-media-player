                } catch(err) {}
              }
              async function renderDiscoverFeed(force) {
                var container = document.getElementById('disc-genres');
                if (!container) return;
                var feed = await loadDiscoverFeed(force);
                
                var html = '';
                GENRES.forEach(function(g){
                  var items = feed[g.name] || [];
                  if (!items.length) return;
                  
                  html += '<div class="disc-genre" style="margin-bottom:24px;">' +
                    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
                    '<h3 style="margin:0;font-size:16px;">' + g.name + '</h3>' +
                    '<button class="disc-viewall" data-genre="' + g.name + '" style="background:none;border:none;color:#7c3aed;cursor:pointer;font-size:14px;">View All ›</button>' +
                    '</div>' +
                    '<div class="disc-carousel" style="display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;">';
                  
                  items.slice(0, 15).forEach(function(item, idx){
                    html += '<div class="disc-card" data-idx="' + idx + '" data-genre="' + g.name + '" ' +
                      'style="flex:0 0 156px;width:156px;max-width:156px;cursor:pointer;overflow:hidden;">' +
                      '<div style="position:relative;width:156px;aspect-ratio:2/3;overflow:hidden;border-radius:8px;">' +
                      '<img src="' + item.poster + '" style="width:100%;height:100%;object-fit:cover;display:block;" loading="lazy">' +
                      '<span style="position:absolute;top:6px;left:6px;background:#7c3aed;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;z-index:2;">' + item.dubLang + ' DUB</span>' +
                      '<button class="disc-heart" data-title="' + item.title.replace(/"/g, '&quot;') + '" style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:16px;width:30px;height:30px;border-radius:50%;cursor:pointer;z-index:2;">🤍</button>' +
                      (item.rating ? '<span style="position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;z-index:2;">★' + item.rating + '</span>' : '') +
                      '</div>' +
                      '<div style="font-size:12px;margin-top:6px;line-height:1.3;height:2.6em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-overflow:ellipsis;word-break:break-word;">' + item.title + '</div>' +
                      '<div style="font-size:11px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + (item.year || '') + ' · ' + (item.format || '') + '</div>' +
                      '</div>';
                  });
                  
                  html += '</div></div>';
                });
                
                // Add Hentai (18+) row using hanime index
                html += '<div class="disc-genre" id="disc-hentai-row" style="margin-bottom:24px;">' +
                  '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
                  '<h3 style="margin:0;font-size:16px;">🔞 Hentai (18+)</h3>' +
                  '<button class="disc-viewall-hentai" style="background:none;border:none;color:#7c3aed;cursor:pointer;font-size:14px;">View All ›</button>' +
                  '</div>' +
                  '<div class="disc-carousel" id="disc-hentai-carousel" style="display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;">' +
                  '<p style="color:#888;">Loading hentai...</p></div></div>';
                
                container.innerHTML = html;
                
                // Load hentai row
                loadHentaiRow();
                
                // Wire card clicks: store feed on window for reliable access
                window.__discoverFeed = feed;
                container.querySelectorAll('.disc-card').forEach(function(card){
                  card.onclick = function(e){
                    if (e.target.classList.contains('disc-heart') || e.target.closest('.disc-heart')) return;
                    var idx = parseInt(card.getAttribute('data-idx'), 10);
                    var genreName = card.getAttribute('data-genre');
                    var item = null;
                    var f = window.__discoverFeed || feed;
                    if (f && f[genreName] && f[genreName][idx]) {
                      item = f[genreName][idx];
                    }
                    if (item) {
                      openDiscoverDetail(item);
