              function ohRecord(anime, anilistId, ep, episodes, position, duration, format) {
                var h = ohLoad();
                var id = 'online-' + anilistId + '-' + ep;
                var epInfo = null;
                if (episodes) { for (var i = 0; i < episodes.length; i++) { if (episodes[i] && episodes[i].number == ep) { epInfo = episodes[i]; break; } } }
                var entry = {
                  id: id, anilistId: anilistId, ep: ep,
                  title: anime.title || 'Unknown',
