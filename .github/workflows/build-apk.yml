                      if (!isComingSoon) {
                        var epLoopCount = Math.max(totalPlanned, streamEps.length, isReleasing && nextEp ? nextEp : 0);
                        for (var eIdx = 0; eIdx < epLoopCount; eIdx++) {
                          var epNum = eIdx + 1;
                          var streamEp = streamEps[eIdx] || null;
                          var scItem = airScheduleMap.get(epNum);
                          var epAirTs = scItem ? scItem.airingAt : (epNum === nextEp && tv.nextAiringEpisode ? tv.nextAiringEpisode.airingAt : null);

                          var cleanEpTitle = "Episode " + epNum;
                          if (streamEp && streamEp.title) {
                            cleanEpTitle = streamEp.title.replace(/^Episode\s*\d+\s*[-:]\s*/i, "").trim() || streamEp.title;
                          }

                          // Clean, human arrival date like "Sep 10", "Jan 14", "Apr 10"
                          var cleanArriveDate = formatArriveDate(null, epAirTs, sDate, eIdx);

                          var isUpcomingEp = isReleasing && nextEp != null && epNum >= nextEp;
                          var epAirStatus = null;
                          if (isUpcomingEp) {
                            if (epNum === nextEp && tv.nextAiringEpisode) {
                              epAirStatus = "⏳ Next Ep · Airs " + formatCountdown(tv.nextAiringEpisode.timeUntilAiring);
                            } else {
                              epAirStatus = "⏳ Upcoming episode";
                            }
                          } else if (isReleasing && epNum === airedCount) {
                            epAirStatus = "🟢 Latest aired";
                          }

                          result.episodes.push({
                            id: tv.id * 1000 + epNum,
                            seasonNumber: sNum,
                            episodeNumber: epNum,
                            title: cleanEpTitle,
                            arriveDate: cleanArriveDate,
                            airDate: sDate,
                            runtimeMinutes: tv.duration || 24,
                            airStatus: epAirStatus,
                            isUpcoming: isUpcomingEp,
                            sourceUrl: (streamEp && streamEp.url) || tv.siteUrl || null,
                            thumbnailUrl: (streamEp && streamEp.thumbnail) || sThumb,
                            localFileName: null
                          });
                        }
                      }
                    });

                    var nonTvNodes = franchiseNodes.filter(function(n) {
                      return ["MOVIE", "OVA", "SPECIAL", "ONA", "TV_SHORT"].indexOf(n.format) !== -1 && tvNodes.indexOf(n) === -1;
                    });

                    result.relatedMedia = nonTvNodes.map(function(n, idx) {
                      var isUnrel = n.status === "NOT_YET_RELEASED";
                      var isRel = n.status === "RELEASING";
