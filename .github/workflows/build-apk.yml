                    }

                    tvNodes.forEach(function(tv, sIdx) {
                      var sNum = sIdx + 1;
                      var isComingSoon = tv.status === "NOT_YET_RELEASED";
                      var isReleasing = tv.status === "RELEASING";
                      var sYear = tv.seasonYear || (tv.startDate && tv.startDate.year) || null;
                      var sDate = formatAniDate(tv.startDate, sYear, isComingSoon);
                      var sThumb = (tv.coverImage && (tv.coverImage.extraLarge || tv.coverImage.large)) || result.posterUrl;
                      var streamEps = (tv.streamingEpisodes || []).slice();

                      var nextEp = tv.nextAiringEpisode ? tv.nextAiringEpisode.episode : null;
                      var airedCount = isComingSoon
                        ? 0
                        : isReleasing
                          ? (nextEp ? Math.max(0, nextEp - 1) : streamEps.length)
                          : (tv.episodes || streamEps.length || 12);

                      var totalPlanned = tv.episodes || (isReleasing ? Math.max(airedCount + 1, streamEps.length) : airedCount);

                      var statusText = "";
                      var badgeText = null;

                      if (isComingSoon) {
                        var airHint = (tv.startDate && tv.startDate.year)
                          ? ("Airs " + formatAniDate(tv.startDate, sYear, false))
                          : "Release date TBA";
                        statusText = "⏳ Coming Soon · " + airHint;
                        badgeText = "⏳ Coming Soon";
                      } else if (isReleasing) {
                        var countdown = tv.nextAiringEpisode ? formatCountdown(tv.nextAiringEpisode.timeUntilAiring) : null;
                        statusText = "🟢 Running at Ep " + airedCount + (tv.episodes ? (" / " + tv.episodes) : "") + (nextEp && countdown ? (" · Ep " + nextEp + " " + countdown) : "");
                        badgeText = "🟢 Running at Ep " + airedCount + (tv.episodes ? (" / " + tv.episodes) : "");
                      } else {
                        statusText = totalPlanned + " episodes";
                      }

                      result.seasons.push({
                        seasonNumber: sNum,
                        releaseYear: sYear,
                        firstAirDate: sDate,
                        thumbnailUrl: sThumb,
                        statusText: statusText,
                        badgeText: badgeText,
                        isComingSoon: isComingSoon,
                        isReleasing: isReleasing,
                        airedCount: airedCount
                      });

                      // Map out episode air dates from AniList airingSchedule
                      var airScheduleMap = new Map();
                      var scheduleNodes = (tv.airingSchedule && tv.airingSchedule.nodes) || [];
                      scheduleNodes.forEach(function(sc) {
                        if (sc && sc.episode) airScheduleMap.set(sc.episode, sc);
