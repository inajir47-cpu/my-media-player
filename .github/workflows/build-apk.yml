              async function showHentaiGrid() {
                var disc = document.getElementById('discover-view');
                try {
                  var idx = await hvGetIndex();
                  var items = idx || [];
                  disc.innerHTML = '<div style="padding:16px;">' +
                    '<button id="disc-back" style="background:none;border:none;color:#7c3aed;cursor:pointer;font-size:15px;margin-bottom:16px;">‹ Back to Discover</button>' +
                    '<h2 style="margin:0 0 16px 0;">🔞 Hentai (18+) - All</h2>' +
                    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;">' +
                    items.map(function(e, hidx){
                      var m = hvMapResult(e);
                      return '<div class="disc-card" data-hidx="' + hidx + '" style="cursor:pointer;">' +
                        '<div style="position:relative;width:100%;aspect-ratio:2/3;overflow:hidden;border-radius:8px;">' +
                        '<img src="' + (m.image || '') + '" style="width:100%;height:100%;object-fit:cover;" loading="lazy">' +
                        '<span style="position:absolute;top:6px;left:6px;background:#dc2626;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;">18+</span>' +
                        '</div><div style="font-size:12px;margin-top:6px;">' + m.title + '</div></div>';
                    }).join('') + '</div></div>';
                  window.__discoverHentaiAll = items;
                  document.getElementById('disc-back').onclick = function(){ renderDiscover(); };
                  disc.querySelectorAll('.disc-card').forEach(function(card){
                    card.onclick = function(){
