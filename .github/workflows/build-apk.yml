              color: var(--accent) !important;
              background: color-mix(in srgb, var(--accent) 10%, var(--surface)) !important;
              cursor: pointer;
              font-size: 13px;
            }
            .folder-pick-btn:hover {
              background: color-mix(in srgb, var(--accent) 18%, var(--surface)) !important;
            }
            .clear-files-btn {
              min-height: 44px;
              padding: 0 14px !important;
              font-size: 12px;
              color: var(--dim) !important;
            }
            .title-suggestion-bar {
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 10px;
              margin-top: 6px;
              padding: 8px 12px;
              background: color-mix(in srgb, var(--accent) 12%, var(--surface));
              border-left: 3px solid var(--accent);
              font-size: 12px;
              color: var(--text);
            }
            .suggestion-apply-btn {
              background: var(--accent);
              color: #111;
              border: 0;
              padding: 4px 10px;
              font-weight: 800;
              font-size: 11px;
              cursor: pointer;
            }
            .suggestion-active-note {
              color: var(--accent);
              font-weight: 700;
            }
            /* Continue Watching & History Cards */
            .continue-section {
              padding: 32px clamp(18px, 4vw, 56px) 0 !important;
            }
            .continue-heading {
              display: flex !important;
              justify-content: space-between !important;
              align-items: center !important;
              gap: 14px !important;
              margin-bottom: 16px !important;
            }
            .continue-heading-actions {
              display: flex;
              align-items: center;
              gap: 10px;
            }
            .history-link-btn {
              background: var(--surface-2);
              color: var(--text);
              border: 0;
              border-radius: 8px;
              padding: 7px 12px;
              font-size: 12px;
              font-weight: 800;
              cursor: pointer;
            }
            .history-link-btn:hover {
              background: var(--accent);
              color: #111;
            }
            .continue-card {
              position: relative !important;
              border-radius: 12px !important;
              overflow: hidden !important;
              background: var(--surface-2) !important;
              box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35) !important;
              border: 0 !important;
            }
            .continue-art {
              aspect-ratio: 16 / 9 !important;
            }
            .continue-badge {
              position: absolute;
              top: 10px;
              left: 10px;
              z-index: 3;
              background: rgba(0, 0, 0, 0.68);
              backdrop-filter: blur(6px);
              color: #fff;
              padding: 4px 8px;
              border-radius: 6px;
              font-size: 11px;
              font-weight: 900;
              letter-spacing: 0.02em;
            }
            .continue-time-pill {
              position: absolute;
              bottom: 10px;
              right: 10px;
              z-index: 3;
              background: rgba(0, 0, 0, 0.75);
              color: #ffd36a;
              padding: 3px 7px;
              border-radius: 5px;
              font-size: 10.5px;
              font-weight: 800;
            }
            .continue-copy {
              padding: 12px 14px !important;
              background: var(--surface) !important;
            }
            .history-open-series {
              background: transparent;
              border: 0;
              color: var(--accent);
              font-size: 11px;
              font-weight: 800;
              cursor: pointer;
              padding: 2px 0;
              text-align: left;
            }
            .history-grid-full {
              display: grid !important;
              grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)) !important;
              gap: 16px !important;
              padding-bottom: 36px !important;
            }
            .episode-grid {
              grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)) !important;
              gap: 16px !important;
            }
            .episode-card,
            .episode-card.connected {
              position: relative !important;
              display: block !important;
              aspect-ratio: 16 / 9 !important;
              border: 0 !important;
              outline: 0 !important;
              border-radius: 12px !important;
              overflow: hidden !important;
              background: var(--surface-2) !important;
              box-shadow: 0 10px 28px rgba(0, 0, 0, 0.38) !important;
            }
            .episode-visual {
              position: absolute !important;
              inset: 0 !important;
              width: 100% !important;
              height: 100% !important;
              min-height: 0 !important;
            }
            .episode-thumb {
              position: absolute !important;
              inset: 0 !important;
              width: 100% !important;
              height: 100% !important;
              min-height: 0 !important;
              padding: 14px !important;
              border: 0 !important;
              display: block !important;
            }
            .episode-shade {
              background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.45) 0%,
                rgba(0, 0, 0, 0.12) 38%,
                rgba(0, 0, 0, 0.82) 72%,
                rgba(0, 0, 0, 0.96) 100%
              ) !important;
            }
            .episode-thumb:hover .episode-shade {
              background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.3) 0%,
                rgba(0, 0, 0, 0.1) 38%,
                rgba(0, 0, 0, 0.78) 72%,
                rgba(0, 0, 0, 0.94) 100%
              ) !important;
            }
            .episode-number {
              position: absolute !important;
              top: 10px !important;
              left: 12px !important;
              font-size: 18px !important;
              font-weight: 900 !important;
              letter-spacing: -0.03em !important;
              background: rgba(0, 0, 0, 0.6) !important;
              backdrop-filter: blur(6px) !important;
              padding: 4px 9px !important;
              border-radius: 6px !important;
              z-index: 2 !important;
            }
            .episode-play {
              position: absolute !important;
              top: 42% !important;
              left: 50% !important;
              transform: translate(-50%, -50%) !important;
              width: 44px !important;
              height: 44px !important;
              background: rgba(0, 0, 0, 0.68) !important;
              backdrop-filter: blur(6px) !important;
              z-index: 2 !important;
            }
            .episode-card.connected .episode-play {
              background: var(--accent) !important;
              color: #111 !important;
            }
            .thumb-edit {
              top: 10px !important;
              right: 10px !important;
              border: 0 !important;
              border-radius: 8px !important;
              background: rgba(0, 0, 0, 0.6) !important;
              backdrop-filter: blur(6px) !important;
            }
            .episode-online {
              top: 10px !important;
              right: 50px !important;
              bottom: auto !important;
              transform: none !important;
              width: 34px !important;
              height: 34px !important;
              border: 0 !important;
            }
            .episode-card > div:last-child {
              position: absolute !important;
              left: 0 !important;
              right: 0 !important;
              bottom: 0 !important;
              z-index: 3 !important;
              padding: 10px 14px 12px !important;
              pointer-events: none !important;
              display: flex !important;
              flex-direction: column !important;
              justify-content: flex-end !important;
            }
            .episode-card h3 {
              color: #fff !important;
              font-size: 14px !important;
              font-weight: 800 !important;
              line-height: 1.25 !important;
              margin: 0 !important;
              text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95) !important;
              display: -webkit-box !important;
              -webkit-line-clamp: 2 !important;
              -webkit-box-orient: vertical !important;
              overflow: hidden !important;
            }
            .episode-card p {
              color: rgba(255, 255, 255, 0.88) !important;
              font-size: 11.5px !important;
              font-weight: 700 !important;
              margin: 4px 0 0 !important;
              text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95) !important;
            }
            .episode-panel-heading h3 {
              font-size: 21px !important;
              font-weight: 850 !important;
            }
            .watch-order-card,
            .watch-order-card.active {
              border: 0 !important;
              border-radius: 10px !important;
            }
            .watch-order-card.active {
              background: color-mix(in srgb, var(--accent) 18%, var(--surface)) !important;
            }
            .file-list {
              background: transparent !important;
              border: 0 !important;
              gap: 8px !important;
            }
            .file-row {
              border: 0 !important;
              border-radius: 10px !important;
            }
            /* ===== Online player full-screen shell ===== */
            .awp-overlay{position:fixed;inset:0;z-index:100000;background:#000;display:flex;flex-direction:column}
            .awp-shell{flex:1;display:flex;flex-direction:column;min-height:0}
            .awp-shell .awp{flex:1}
            /* VLC-style mini player mode for online player */
            .awp-overlay.awp-mini{inset:auto;left:12px;right:12px;bottom:80px;top:auto;height:220px;border-radius:12px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:100001}
            .awp-overlay.awp-mini .awp-top,.awp-overlay.awp-mini .awp-bot{display:none}
            .awp-overlay.awp-mini .awp-video{object-fit:cover}
            /* Option A: awp-overlay mirrors vlc-player */
            .awp-overlay .awp-top {
              display: flex !important;
              align-items: flex-start !important;
              justify-content: space-between !important;
              padding: 16px 20px !important;
              background: linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.35) 62%,transparent) !important;
            }
            .awp-playing-dot {
              display: inline-block !important;
              width: 10px !important;
              height: 10px !important;
              border-radius: 50% !important;
              background: #ff7a12 !important;
              margin-right: 8px !important;
              animation: awp-pulse 1.5s ease-in-out infinite !important;
              vertical-align: middle !important;
            }
            @keyframes awp-pulse {
              0%, 100% { opacity: 1; transform: scale(1); }
              50% { opacity: 0.5; transform: scale(0.85); }
            }
            .awp-status {
              color: #ff7a12 !important;
              font-weight: 700 !important;
              font-size: 12px !important;
              letter-spacing: 1.5px !important;
              text-transform: uppercase !important;
            }
            .awp-overlay .awp-bot {
              background: linear-gradient(transparent,rgba(0,0,0,.55) 34%,rgba(0,0,0,.88)) !important;
              padding: 10px 20px max(18px,env(safe-area-inset-bottom)) !important;
            }
            .awp-overlay .awp-playmid {
              width: 58px !important;
              height: 58px !important;
              min-width: 58px !important;
              border-radius: 50% !important;
              background: #ff7a12 !important;
              color: #fff !important;
              font-size: 22px !important;
            }
            .awp-overlay .awp-prog {
              height: 6px !important;
              border-radius: 3px !important;
              background: rgba(255,255,255,0.2) !important;
            }
            .awp-overlay .awp-fill {
              background: linear-gradient(90deg,#ff7a12,#ff9a3c) !important;
              border-radius: 3px !important;
            }
            /* Queue drawer */
            .awp-queue {
              position: absolute !important;
              top: 0 !important;
              right: 0 !important;
              bottom: 0 !important;
              width: min(320px, 85%) !important;
              background: rgba(12,13,16,.98) !important;
              backdrop-filter: blur(16px) !important;
              border-left: 1px solid rgba(255,255,255,.08) !important;
              z-index: 10 !important;
              transform: translateX(100%) !important;
              transition: transform 0.3s ease !important;
              display: flex !important;
              flex-direction: column !important;
            }
            .awp-queue.open {
              transform: translateX(0) !important;
            }
            .awp-queue-head {
              display: flex !important;
              justify-content: space-between !important;
              align-items: center !important;
              padding: 16px !important;
              border-bottom: 1px solid rgba(255,255,255,.08) !important;
              font-weight: 700 !important;
            }
            .awp-queue-list {
              flex: 1 !important;
              overflow-y: auto !important;
              padding: 8px !important;
            }
            .awp-queue-item {
              display: flex !important;
              align-items: center !important;
              gap: 12px !important;
              padding: 10px 12px !important;
              border-radius: 8px !important;
              cursor: pointer !important;
              color: #fff !important;
              background: transparent !important;
              border: none !important;
              width: 100% !important;
              text-align: left !important;
              font-size: 14px !important;
            }
            .awp-queue-item:active { background: rgba(255,255,255,.08) !important; }
            .awp-queue-item.current {
              background: rgba(255,122,18,.15) !important;
              color: #ff7a12 !important;
            }
            /* Gesture feedback */
            .awp-gesture-fb {
              position: absolute !important;
              top: 50% !important;
              left: 50% !important;
              transform: translate(-50%,-50%) !important;
              background: rgba(10,10,12,.82) !important;
              backdrop-filter: blur(8px) !important;
              border-radius: 14px !important;
              border: 1px solid rgba(255,255,255,.10) !important;
              padding: 16px 24px !important;
              font-size: 18px !important;
              color: #fff !important;
              z-index: 20 !important;
              pointer-events: none !important;
              opacity: 0 !important;
              transition: opacity 0.2s !important;
            }
            .awp-gesture-fb.show { opacity: 1 !important; }
            /* VLC-style polish for online player controls */
            .awp-icobtn{background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
            .awp-icobtn:active{background:rgba(255,255,255,.25)}
            .awp-btn{background:rgba(255,255,255,.08);border:none;color:#fff;min-width:40px;height:40px;border-radius:8px;font-size:16px;cursor:pointer}
            .awp-btn:active{background:rgba(255,255,255,.2)}

            /* ===== Online detail full-page (local-style) ===== */
            .awd-page{position:fixed;inset:0;z-index:99998;background:#0b0d12;color:#eef;overflow-y:auto;-webkit-overflow-scrolling:touch}
            body.aw-detail-open{overflow:hidden}
            .awd-top{position:sticky;top:0;z-index:5;background:rgba(11,13,18,.92);backdrop-filter:blur(8px);padding:10px 16px;border-bottom:1px solid #1d212b}
            .awd-back{background:transparent;border:1px solid #3a3f4b;color:#fff;font-size:15px;padding:7px 16px;border-radius:6px;cursor:pointer}
            .awd-back:active{background:#1d212b}
            .awd-banner{width:100%;max-height:220px;overflow:hidden}
            .awd-banner img{width:100%;height:100%;object-fit:cover;display:block}
            .awd-hero{display:flex;gap:22px;padding:24px 20px;max-width:1100px;margin:0 auto}
            .awd-poster{flex:0 0 300px}
            .awd-poster img{width:100%;border-radius:8px;display:block;box-shadow:0 8px 32px rgba(0,0,0,.5)}
            .awd-info{flex:1;min-width:0}
            .awd-eyebrow{color:#f2994a;font-size:13px;font-weight:700;letter-spacing:2px;margin-bottom:10px}
            .awd-title{font-size:clamp(32px,6vw,64px);font-weight:800;margin:0 0 14px;line-height:1.05;color:#fff}
            .awd-scorerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
            .awd-score{color:#f2994a;font-size:18px;font-weight:700}
            .awd-genre{border:1px solid #3a3f4b;border-radius:6px;padding:5px 12px;font-size:13px;color:#cfd4de}
            .awd-syn{font-size:15px;line-height:1.65;color:#d5dae3;margin:0 0 14px;max-width:720px}
            .awd-meta{font-size:13px;color:#9aa1b0;margin-bottom:6px}
            .awd-badges{display:flex;gap:8px;margin-top:12px}
            .awd-reviews{max-width:1100px;margin:0 auto;padding:0 20px}
            .awd-review{background:#14161c;border:1px solid #232833;border-radius:10px;padding:12px 14px;margin-bottom:10px}
            .awd-review-h{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
            .awd-review-r{color:#f2994a}
            .awd-review-t{font-size:13px;color:#c6ccd7;line-height:1.5}
            .awd-sect{max-width:1100px;margin:18px auto 10px;padding:0 20px;font-size:16px;font-weight:700;color:#fff}
            .awd-wosect{max-width:1100px;margin:26px auto 0;padding:0 20px;border-top:1px solid #1d212b;padding-top:24px}
            .awd-wosect h2{font-size:28px;font-weight:700;margin:0 0 6px;color:#fff}
            .awd-wosub{font-size:13px;color:#9aa1b0;margin:0 0 18px}
            .awd-epshead{max-width:1100px;margin:0 auto;padding:0 20px}
            .awd-continue{display:flex;align-items:center;gap:12px;width:calc(100% - 40px);max-width:1060px;margin:6px auto 22px;padding:15px 18px;background:#e8632c;border:0;border-radius:12px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;text-align:left}
            .awd-continue-play{font-size:18px;line-height:1}
            .awd-epwatch{display:inline-block;margin:6px 10px 10px;font-size:11px;font-weight:700;color:#ffd9a8;background:#3a2a1a;border:1px solid #7a5a34;border-radius:20px;padding:2px 8px}
            .awd-epshead h2{font-size:22px;font-weight:700;margin:0 0 14px;color:#fff}
            .awd-eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;max-width:1100px;margin:0 auto;padding:0 20px 40px}
            .awd-ep{position:relative;background:#14161c;border:1px solid #232833;border-radius:10px;overflow:hidden;cursor:pointer;padding:0;text-align:left;color:#fff}
            .awd-ep:active{border-color:#f2994a}
            .awd-epthumb{position:relative;display:block;aspect-ratio:16/9;background:#0e1015;overflow:hidden}
            .awd-epthumb img{width:100%;height:100%;object-fit:cover;display:block}
            .awd-epplay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(242,153,74,.92);color:#111;display:flex;align-items:center;justify-content:center;font-size:20px}
            .awd-epnum{position:absolute;top:8px;left:8px;z-index:2;background:rgba(0,0,0,.72);border-radius:6px;padding:4px 10px;font-size:15px;font-weight:800}
            .awd-epglobe{position:absolute;top:8px;right:8px;z-index:2;background:#f2994a;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:17px}
            .awd-eptitle{display:block;font-size:14px;font-weight:700;padding:10px 12px 2px;line-height:1.35}
            .awd-epmeta{display:block;font-size:12px;color:#9aa1b0;padding:0 12px 12px}
            .awd-loading{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60vh;font-size:15px;color:#9aa1b0}
            .awd-status{max-width:1100px;margin:30px auto;padding:0 20px;color:#9aa1b0;font-size:15px}
            @media (max-width:640px){.awd-hero{flex-direction:column;padding:16px}.awd-poster{flex:none;max-width:220px}.awd-eps{grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px 32px}.awd-epshead,.awd-wosect,.awd-sect,.awd-reviews,.awd-status{padding-left:12px;padding-right:12px}}

            /* ===== Anime SUB/DUB watch (streaming API) ===== */
            .aw-overlay{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.74);display:flex;align-items:flex-start;justify-content:center;padding:18px 12px;overflow-y:auto}
            .aw-modal{background:#14161c;color:#eef;border-radius:14px;width:min(620px,100%);max-height:94vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid #2a2e38}
            .aw-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px 4px}
            .aw-eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9aa3b2;margin:0}
            .aw-title{margin:2px 0 0;font-size:18px;line-height:1.25}
            .aw-x{background:#23262e;border:0;color:#fff;width:32px;height:32px;min-width:32px;border-radius:50%;font-size:15px;cursor:pointer}
            .aw-server,.aw-search{display:flex;gap:8px;padding:6px 16px}
            .aw-hint{padding:0 16px 2px;color:#9aa3b2;font-size:11px}
            .aw-server input,.aw-search input{flex:1;min-width:0;background:#0f1116;border:1px solid #2a2e38;color:#fff;border-radius:8px;padding:8px 10px;font-size:13px}
            .aw-server button,.aw-search button,.aw-back,.aw-nav,.aw-abtn{background:#e8632c;border:0;color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
            .aw-server button{background:#2a2e38}
            .aw-body{padding:12px 16px 16px;overflow-y:auto}
            .aw-status{color:#9aa3b2;padding:18px 4px;font-size:14px;line-height:1.5}
            .aw-err{background:#3a1d1d;border:1px solid #7a2e2e;color:#ffc9c9;border-radius:8px;padding:12px;font-size:13px;line-height:1.55}
            .aw-err b{color:#fff}
            .aw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
            .aw-card{background:#0f1116;border:1px solid #2a2e38;border-radius:10px;padding:0;overflow:hidden;cursor:pointer;text-align:left;color:#fff}
            .aw-card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
            .aw-online{padding:20px 24px 34px;max-width:1150px;margin:0 auto}
            .aw-online.aw-unified{padding:4px 24px 34px}
            .aw-online.aw-unified .aw-oserver{display:none}
            .aw-ohead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
            .aw-ohead .aw-ot{font-size:17px;font-weight:800;color:var(--text,#e8ecf3)}
            .aw-ohead .aw-osub{font-size:12.5px;color:var(--dim,#9aa3b2)}
            .aw-oserver{display:flex;gap:8px;align-items:center;margin:0 0 12px;font-size:12.5px;color:var(--dim,#9aa3b2);flex-wrap:wrap}
            .aw-ostatus{color:var(--dim,#9aa3b2);padding:20px 4px;font-size:14px;display:flex;align-items:center;gap:10px}
            .aw-unified .aw-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
            .aw-noimg{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:30px;background:#1c1f26}
            .aw-card-t{font-size:12px;padding:8px 8px 2px;font-weight:600;line-height:1.3}
            .aw-badges{display:flex;gap:6px;padding:6px 8px 10px}
            .aw-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.04em}
            .aw-badge.sub{background:#1d3a5f;color:#7fb7ff}
            .aw-badge.dub{background:#3a2a1d;color:#ffb37f}
            .aw-backrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
            .aw-count{color:#9aa3b2;font-size:12px}
            .aw-eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
            .aw-ep{background:#0f1116;border:1px solid #2a2e38;color:#fff;border-radius:8px;padding:10px 4px;font-size:12px;font-weight:600;cursor:pointer}
            .aw-ep-cur{border-color:#e8632c;color:#ff9a5c}
            .aw-ep-t{display:block;font-size:10px;font-weight:400;color:#9aa3b2;margin-top:4px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
            .aw-reviews{display:flex;flex-direction:column;gap:10px;margin-top:4px}
            .aw-review{background:#0f1116;border:1px solid #2a2e38;border-radius:10px;padding:10px 12px}
            .aw-review-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px;gap:8px}
            .aw-review-a{font-weight:700;color:#ffd36a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
            .aw-review-r{color:#9aa3b2;font-size:11px;flex-shrink:0}
            .aw-review-t{font-size:12px;color:#c9c4bb;line-height:1.55}
            .aw-delcf{position:fixed;inset:0;z-index:100004;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:24px}
            .aw-delbox{background:#171b23;border:1px solid #2e3440;border-radius:14px;max-width:380px;width:100%;padding:20px}
            .aw-delt{font-size:16px;font-weight:800;margin-bottom:8px;color:#fff}
            .aw-delm{font-size:13px;color:#b8b3aa;line-height:1.55;margin-bottom:18px}
            .aw-delbtns{display:flex;gap:10px;justify-content:flex-end}
            .aw-delcancel{background:#23262e;border:1px solid #2e3440;color:#fff;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer}
            .aw-delyes{background:#b3372c;border:1px solid #b3372c;color:#fff;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer}
            .aw-player{display:block;padding:4px 2px}
            .awp{position:fixed;inset:0;background:#000;z-index:100000;user-select:none;-webkit-user-select:none;touch-action:manipulation}
            .awp-video{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
            .awp-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:14px 14px 40px;background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,0));opacity:0;pointer-events:none;transition:opacity .25s;z-index:3}
            .awp.showui .awp-top{opacity:1;pointer-events:auto}
            .awp-status{font-size:10px;font-weight:800;letter-spacing:.14em;color:#e8632c;text-transform:uppercase;margin:2px 0 2px 4px}
            .awp-title{font-size:17px;font-weight:800;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.7);margin-left:4px;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            .awp-topicons{display:flex;gap:10px}
            .awp-icobtn{width:42px;height:42px;border-radius:50%;border:0;background:rgba(40,44,52,.72);color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
            .awp-icobtn:active{transform:scale(.92)}
            .awp-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;pointer-events:none}
            .awp-big{pointer-events:auto;width:84px;height:84px;border-radius:50%;border:0;background:rgba(232,99,44,.96);color:#fff;font-size:32px;line-height:1;cursor:pointer;box-shadow:0 10px 34px rgba(232,99,44,.5);display:flex;align-items:center;justify-content:center;padding:0 0 4px 6px}
            .awp-big:active{transform:scale(.94)}
            .awp-spin{display:none;width:56px;height:56px;border-radius:50%;border:4px solid rgba(255,255,255,.22);border-top-color:#e8632c;animation:awpspin .9s linear infinite}
            @keyframes awpspin{to{transform:rotate(360deg)}}
            .awp-err{display:none;position:absolute;bottom:110px;left:16px;right:16px;text-align:center;color:#ffb3b3;font-size:13px;background:rgba(0,0,0,.66);padding:10px 14px;border-radius:10px;pointer-events:auto;z-index:5}
            .awp-bot{position:absolute;left:0;right:0;bottom:0;padding:40px 10px 12px;background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,0));opacity:0;pointer-events:none;transition:opacity .25s;z-index:3}
            .awp.showui .awp-bot{opacity:1;pointer-events:auto}
            .awp-prog{position:relative;height:26px;cursor:pointer;touch-action:none;margin:0 6px}
            .awp-track{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;background:rgba(255,255,255,.28)}
            .awp-buf{position:absolute;left:0;top:11px;height:4px;border-radius:2px;background:rgba(255,255,255,.4);width:0}
            .awp-fill{position:absolute;left:0;top:11px;height:4px;border-radius:2px;background:#e8632c;width:0;box-shadow:0 0 8px rgba(232,99,44,.7)}
            .awp-knob{position:absolute;left:0;top:13px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.55)}
            .awp-row{display:flex;align-items:center;gap:0;margin-top:4px}
            .awp-btn{background:none;border:0;color:#fff;font-size:18px;min-width:44px;height:48px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 6px;opacity:.92}
            .awp-btn:active{opacity:1;transform:scale(.94)}
            .awp-btn.dim{opacity:.45}
            .awp-playmid{width:58px;height:58px;min-width:58px;border-radius:50%;background:#e8632c;font-size:22px;margin:0 4px;box-shadow:0 6px 22px rgba(232,99,44,.5)}
            .awp-sk{position:relative;font-size:22px;line-height:1}
            .awp-sk i{position:absolute;left:50%;top:50%;transform:translate(-50%,-40%);font-style:normal;font-size:8px;font-weight:800}
            .awp-time{font-size:12px;color:#fff;font-variant-numeric:tabular-nums;margin:0 8px;white-space:nowrap}
            .awp-time .dim{color:rgba(255,255,255,.55)}
            .awp-flex{flex:1}
            .awp-vol{display:flex;align-items:center;gap:2px;margin-right:2px}
            .awp-vol input[type=range]{width:70px;accent-color:#e8632c;cursor:pointer}
            .awp-rate{font-size:13px;font-weight:800}
            .awp-sheet{position:absolute;right:10px;bottom:86px;min-width:220px;max-width:82%;max-height:60%;overflow:auto;background:rgba(18,20,25,.97);border:1px solid rgba(255,255,255,.12);border-radius:12px;z-index:4;display:none;box-shadow:0 12px 40px rgba(0,0,0,.5);padding:4px}
            .awp-sheet.open{display:block}
            .awp-sh{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#9aa3b2;padding:10px 12px 4px}
            .awp-sheet button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;font-size:13.5px;padding:10px 12px;border-radius:8px;cursor:pointer}
            .awp-sheet button.on{color:#ff8a3d;font-weight:700;background:rgba(232,99,44,.12)}
            .awp-none{font-size:12.5px;color:#9aa3b2;padding:10px 12px}
            button.episode-online.__aw-busy{opacity:.55}
            .aw-link{background:none;border:0;color:#ff9a5c;font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
            .aw-dback{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
            .aw-dbanner{margin:0 -16px 12px;overflow:hidden;max-height:120px}
            .aw-dbanner img{width:100%;height:120px;object-fit:cover;display:block}
            .aw-dhead{display:flex;gap:12px;margin-bottom:10px}
            .aw-dposter{width:96px;height:136px;object-fit:cover;border-radius:8px;flex-shrink:0;background:#23262e}
            .aw-dinfo{min-width:0;flex:1}
            .aw-dtitle{font-size:17px;font-weight:700;line-height:1.3;margin-bottom:4px}
            .aw-dscore{color:#ffc44d;font-size:15px;font-weight:700}
            .aw-dscore10{color:#9aa3b2;font-weight:400;font-size:12px}
            .aw-dmeta{color:#9aa3b2;font-size:12px;margin-top:2px}
            .aw-dgenres{color:#c9d1dd;font-size:12px;margin-top:6px;line-height:1.5}
            .aw-dsyn{font-size:13px;line-height:1.6;color:#d7dce5;max-height:110px;overflow-y:auto;background:#0f1116;border-radius:8px;padding:10px 12px;margin-bottom:8px;white-space:pre-line}
            .aw-dstudios{font-size:12px;color:#9aa3b2;margin-bottom:2px}
            .aw-sect{font-size:14px;font-weight:700;margin:14px 0 8px}
            .aw-hint2{font-size:11px;color:#9aa3b2;margin-top:8px}
            .spinner{display:inline-block;width:14px;height:14px;border:2px solid #444;border-top-color:#e8632c;border-radius:50%;animation:awspin .7s linear infinite;vertical-align:-2px;margin-right:6px}
            @keyframes awspin{to{transform:rotate(360deg)}}
            /* ===== Local video player redesign v2 (Netflix-style polish) ===== */
            .vlc-player{--lp-orange:#ff7a12;--lp-orange-hi:#ff9a2e}
            .vlc-player .player-toolbar{display:flex !important;align-items:flex-start !important;justify-content:space-between !important;gap:12px !important;padding:16px 20px !important;background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.35) 62%,transparent) !important;border:0 !important}
            .vlc-player .player-title{min-width:0 !important;flex:1 1 auto !important}
            .vlc-player .player-title strong{display:block !important;white-space:nowrap !important;overflow:hidden !important;text-overflow:ellipsis !important;font-size:16px !important}
            .vlc-player .player-title small{color:#ffb066 !important;letter-spacing:.14em !important;font-size:10px !important;font-weight:800 !important}
            .vlc-player .playing-indicator{background:var(--lp-orange) !important}
            .vlc-player .yt-toolbar-actions{display:flex !important;align-items:center !important;gap:8px !important;flex-shrink:0 !important;margin-left:auto !important}
            .vlc-player .yt-pill-btn{width:40px !important;height:40px !important;min-width:40px !important;padding:0 !important;border-radius:999px !important;font-size:0 !important;line-height:1 !important;background:rgba(20,20,22,.55) !important;border:1px solid rgba(255,255,255,.16) !important;backdrop-filter:blur(10px) !important;color:#fff !important;display:inline-grid !important;place-items:center !important}
            .vlc-player .yt-pill-btn::before{font-size:18px !important;line-height:1 !important;color:#fff !important}
            .vlc-player .yt-pill-btn[aria-label="Miniplayer"]::before{content:"⌄"}
            .vlc-player .yt-pill-btn[aria-label="Toggle screen fit"]::before{content:"⤢"}
            .vlc-player .yt-pill-btn[aria-label="Picture in Picture"]::before{content:"⧉"}
            .vlc-player .yt-pill-btn:hover{background:rgba(255,255,255,.22) !important;border-color:rgba(255,255,255,.35) !important;color:#fff !important}
            .vlc-player .yt-toolbar-actions>button:last-child{width:40px !important;height:40px !important;border-radius:999px !important;background:rgba(20,20,22,.55) !important;border:1px solid rgba(255,255,255,.16) !important;backdrop-filter:blur(10px) !important;color:#fff !important;display:inline-grid !important;place-items:center !important}
            .vlc-player .yt-toolbar-actions>button:last-child:hover{background:#e5484d !important;border-color:#e5484d !important;color:#fff !important}
            .vlc-player .player-control-deck{background:linear-gradient(transparent,rgba(0,0,0,.55) 34%,rgba(0,0,0,.88)) !important;border:0 !important;box-shadow:none !important;padding:10px 20px max(18px,env(safe-area-inset-bottom)) !important;gap:8px !important}
            .vlc-player .seek-row{grid-template-columns:48px minmax(0,1fr) 48px !important;gap:12px !important;min-height:30px !important}
            .vlc-player .seek-row span{font-size:12.5px !important;color:#eceef1 !important;font-weight:600 !important}
            .vlc-player .seek-row input[type="range"]{height:22px !important}
            .vlc-player .seek-row input[type="range"]::-webkit-slider-runnable-track{height:5px !important;border-radius:999px !important;background:linear-gradient(90deg,var(--lp-orange) 0 var(--seek-progress,0%),rgba(255,255,255,.28) var(--seek-progress,0%) 100%) !important}
            .vlc-player .seek-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none !important;appearance:none !important;width:15px !important;height:15px !important;border-radius:50% !important;background:#fff !important;border:0 !important;margin-top:-5px !important;box-shadow:0 2px 10px rgba(0,0,0,.55) !important;transition:transform .15s ease !important}
            .vlc-player .seek-row input[type="range"]:hover::-webkit-slider-thumb{transform:scale(1.3) !important}
            .vlc-player .seek-row input[type="range"]::-moz-range-track{height:5px !important;border-radius:999px !important;background:rgba(255,255,255,.28) !important}
            .vlc-player .seek-row input[type="range"]::-moz-range-progress{height:5px !important;border-radius:999px !important;background:var(--lp-orange) !important}
            .vlc-player .seek-row input[type="range"]::-moz-range-thumb{width:15px !important;height:15px !important;border-radius:50% !important;background:#fff !important;border:0 !important;box-shadow:0 2px 10px rgba(0,0,0,.55) !important}
            .vlc-player .vlc-control-row{display:flex !important;align-items:center !important;gap:6px !important}
            .vlc-player .transport-controls{display:flex !important;align-items:center !important;gap:2px !important}
            .vlc-player .transport-controls .play-toggle{width:58px !important;height:58px !important;min-width:58px !important;border-radius:999px !important;background:var(--lp-orange) !important;color:#141414 !important;box-shadow:0 8px 24px rgba(255,122,18,.45) !important;margin:0 6px !important;transition:transform .15s ease,background .15s ease !important}
            .vlc-player .transport-controls .play-toggle:hover{background:var(--lp-orange-hi) !important;transform:scale(1.06) !important;color:#141414 !important}
            .vlc-player .transport-controls .play-toggle svg{width:26px !important;height:26px !important}
            .vlc-player .transport-controls button:not(.play-toggle){width:44px !important;min-width:44px !important;height:44px !important;border-radius:999px !important;background:transparent !important;color:#fff !important;backdrop-filter:none !important;border:0 !important}
            .vlc-player .transport-controls button:not(.play-toggle):hover:not(:disabled){background:rgba(255,255,255,.14) !important;color:#fff !important}
            .vlc-player .transport-controls button:not(.play-toggle) svg{width:24px !important;height:24px !important}
            .vlc-player .transport-controls button:disabled{opacity:.32 !important}
            .vlc-player .vlc-utilities{display:flex !important;align-items:center !important;gap:2px !important;margin-left:auto !important}
            .vlc-player .vlc-utilities>button{width:42px !important;min-width:42px !important;height:42px !important;border-radius:999px !important;background:transparent !important;color:#fff !important;backdrop-filter:none !important;border:0 !important}
            .vlc-player .vlc-utilities>button:hover{background:rgba(255,255,255,.14) !important;color:#fff !important}
            .vlc-player .vlc-utilities>button.active{background:var(--lp-orange) !important;color:#141414 !important}
            .vlc-player .vlc-utilities>button.active svg{color:#141414 !important}
            .vlc-player .volume-control{display:flex !important;align-items:center !important;gap:0 !important;width:auto !important;border:0 !important;padding:0 !important}
            .vlc-player .volume-control button{width:42px !important;min-width:42px !important;height:42px !important;border-radius:999px !important;background:transparent !important;color:#fff !important}
            .vlc-player .volume-control button:hover{background:rgba(255,255,255,.14) !important;color:#fff !important}
            .vlc-player .volume-control input[type="range"]{display:block !important;width:76px !important;height:22px !important;margin:0 4px 0 0 !important;cursor:pointer !important;-webkit-appearance:none !important;appearance:none !important;background:transparent !important}
            .vlc-player .volume-control input[type="range"]::-webkit-slider-runnable-track{height:4px !important;border-radius:999px !important;background:rgba(255,255,255,.30) !important}
            .vlc-player .volume-control input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none !important;appearance:none !important;width:12px !important;height:12px !important;border-radius:50% !important;background:var(--lp-orange) !important;border:0 !important;margin-top:-4px !important;box-shadow:0 1px 6px rgba(0,0,0,.5) !important}
            .vlc-player .volume-control input[type="range"]::-moz-range-track{height:4px !important;border-radius:999px !important;background:rgba(255,255,255,.30) !important}
            .vlc-player .volume-control input[type="range"]::-moz-range-thumb{width:12px !important;height:12px !important;border-radius:50% !important;background:var(--lp-orange) !important;border:0 !important}
            .vlc-player .stage-play{width:84px !important;height:84px !important;border-radius:999px !important;background:rgba(255,122,18,.94) !important;color:#141414 !important;border:0 !important;box-shadow:0 12px 34px rgba(0,0,0,.5) !important;transition:transform .16s ease !important}
            .vlc-player .stage-play:hover{transform:scale(1.07) !important}
            .vlc-player .stage-play svg{width:36px !important;height:36px !important;color:#141414 !important}
            .vlc-player .track-options{background:rgba(14,15,18,.97) !important;backdrop-filter:blur(16px) !important;border:1px solid rgba(255,255,255,.10) !important;border-radius:18px !important;padding:20px !important;gap:16px !important;box-shadow:0 22px 60px rgba(0,0,0,.6) !important}
            .vlc-player .track-options>label{display:grid !important;gap:8px !important}
            .vlc-player .track-options label>span{display:flex !important;align-items:center !important;gap:8px !important;justify-content:flex-start !important;font-size:12.5px !important;font-weight:700 !important;color:#dfe3e8 !important}
            .vlc-player .track-options label>span output{margin-left:auto !important;color:var(--lp-orange) !important;font-weight:800 !important}
            .vlc-player .track-options label>span small{color:#8b9097 !important;font-weight:500 !important}
            .vlc-player .track-options select{background:#22252b !important;border:1px solid rgba(255,255,255,.14) !important;border-radius:10px !important;color:#fff !important;font-size:13.5px !important;padding:10px 12px !important;width:100% !important;outline:none !important}
            .vlc-player .track-options select:focus{border-color:var(--lp-orange) !important}
            .vlc-player .track-options .load-subtitle{border:1px solid rgba(255,255,255,.18) !important;border-radius:10px !important;color:#fff !important;font-size:13px !important;font-weight:700 !important;padding:10px 14px !important;display:inline-flex !important;align-items:center !important;gap:8px !important;justify-content:center !important;background:rgba(255,255,255,.06) !important}
            .vlc-player .track-options .load-subtitle:hover{background:var(--lp-orange) !important;border-color:var(--lp-orange) !important;color:#141414 !important}
            .vlc-player .picture-control input[type="range"]{height:22px !important}
            .vlc-player .picture-control input[type="range"]::-webkit-slider-runnable-track{height:4px !important;border-radius:999px !important;background:rgba(255,255,255,.25) !important}
            .vlc-player .picture-control input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none !important;appearance:none !important;width:13px !important;height:13px !important;border-radius:50% !important;background:var(--lp-orange) !important;margin-top:-4.5px !important;border:0 !important}
            .vlc-player .picture-control input[type="range"]::-moz-range-track{height:4px !important;border-radius:999px !important;background:rgba(255,255,255,.25) !important}
            .vlc-player .picture-control input[type="range"]::-moz-range-thumb{width:13px !important;height:13px !important;border-radius:50% !important;background:var(--lp-orange) !important;border:0 !important}
            .vlc-player .player-queue{background:rgba(12,13,16,.98) !important;backdrop-filter:blur(16px) !important;border-left:1px solid rgba(255,255,255,.08) !important}
            .vlc-player .queue-head{padding:14px 16px !important;border-bottom:1px solid rgba(255,255,255,.08) !important;font-size:14px !important;font-weight:800 !important}
            .vlc-player .queue-list>button{border-radius:10px !important;margin:2px 8px !important}
            .vlc-player .queue-list>button.active{background:rgba(255,122,18,.14) !important;box-shadow:inset 3px 0 0 var(--lp-orange) !important}
            .vlc-player .gesture-feedback{background:rgba(10,10,12,.82) !important;backdrop-filter:blur(8px) !important;border-radius:14px !important;border:1px solid rgba(255,255,255,.10) !important}
            @media (max-width:640px){
              .vlc-player .player-control-deck{padding:8px 12px max(14px,env(safe-area-inset-bottom)) !important;grid-template-columns:minmax(0,1fr) !important}
              .vlc-player .player-control-deck>*{min-width:0 !important;max-width:100% !important}
              .vlc-player .seek-row{grid-template-columns:44px minmax(0,1fr) 44px !important;gap:8px !important}
              .vlc-player .seek-row input[type="range"]{min-width:0 !important}
              .vlc-player .vlc-control-row{gap:4px !important}
              .vlc-player .transport-controls{flex:1 1 auto !important;min-width:0 !important;gap:0 !important}
              .vlc-player .transport-controls .play-toggle{width:50px !important;height:50px !important;min-width:50px !important;margin:0 4px !important}
              .vlc-player .transport-controls .play-toggle svg{width:22px !important;height:22px !important}
              .vlc-player .transport-controls button:not(.play-toggle){width:36px !important;min-width:36px !important;height:36px !important}
