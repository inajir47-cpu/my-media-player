                          id: ep.id || (Date.now() + 1000 + idx),
                          seasonNumber: ep.season || 1,
                          episodeNumber: ep.number || (idx + 1),
                          title: ep.name || ("Episode " + (ep.number || idx + 1)),
                          arriveDate: formatArriveDate(ep.airdate, null, null, idx),
                          airDate: ep.airdate || null,
                          runtimeMinutes: ep.runtime || show.averageRuntime || 24,
                          sourceUrl: ep.url || null,
                          thumbnailUrl: (ep.image && (ep.image.original || ep.image.medium)) || null,
                          localFileName: null
