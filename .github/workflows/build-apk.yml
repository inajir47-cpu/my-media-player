                  }
                  window.__discoverHentai = items;
                  var html = '';
                  items.forEach(function(e, hidx){
                    var m = hvMapResult(e);
                    html += '<div class="disc-card disc-hentai-card" data-hidx="' + hidx + '" ' +
                      'style="flex:0 0 156px;width:156px;max-width:156px;cursor:pointer;overflow:hidden;">' +
                      '<div style="position:relative;width:156px;aspect-ratio:2/3;overflow:hidden;border-radius:8px;">' +
                      '<img src="' + (m.image || '') + '" style="width:100%;height:100%;object-fit:cover;display:block;" loading="lazy">' +
                      '<span style="position:absolute;top:6px;left:6px;background:#dc2626;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;z-index:2;">18+</span>' +
                      '</div>' +
                      '<div style="font-size:12px;margin-top:6px;line-height:1.3;height:2.6em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-overflow:ellipsis;word-break:break-word;">' + m.title + '</div>' +
                      '<div style="font-size:11px;opacity:.6;">' + (m.year || '') + '</div>' +
                      '</div>';
                  });
                  carousel.innerHTML = html;
                  carousel.querySelectorAll('.disc-hentai-card').forEach(function(card){
                    card.onclick = function(){
                      var hidx = parseInt(card.getAttribute('data-hidx'), 10);
                      var e = window.__discoverHentai[hidx];
                      if (e) openHentaiDetail(e);
                    };
