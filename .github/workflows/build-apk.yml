                var rawFiles = args.files || [];

                var seenIncoming = new Set();
                var uniqueRawFiles = [];
                rawFiles.forEach(function(f) {
                  var k = String(f.relativePath || f.fileName || "").replace(/\\\\/g, "/").toLowerCase();
                  if (k && !seenIncoming.has(k)) {
                    seenIncoming.add(k);
                    uniqueRawFiles.push(f);
                  }
                });

                var parsedFiles = uniqueRawFiles.map(function(f, idx) {
                  return parseFileEntry(f, kind, idx, db.nextFileId++);
                });

                var existingCol = db.collections.find(function(c) {
                  return normalizeTitleKey(c.title) === titleKey && c.kind === kind;
                }) || db.collections.find(function(c) {
                  return normalizeTitleKey(c.title) === titleKey;
                });

                if (existingCol) {
                  if (args.posterDataBase64) {
                    existingCol.posterUrl = "data:" + (args.posterMimeType || "image/jpeg") + ";base64," + args.posterDataBase64;
                  }
