                db.collections.unshift(newCol);
                saveDB(db);
                return { collection: newCol };
              }

              if (action === "updateArtwork") {
                var col = db.collections.find(function(c) { return Number(c.id) === Number(args.collectionId); });
                if (!col) return { ok: false, message: "Collection not found" };
                var dataUrl = "data:" + (args.imageMimeType || "image/jpeg") + ";base64," + args.imageDataBase64;
                if (args.target === "collection") {
                  col.posterUrl = dataUrl;
                } else if (args.target === "episode") {
                  var ep = (col.episodes || []).find(function(e) { return Number(e.id) === Number(args.episodeId); });
                  if (ep) ep.thumbnailUrl = dataUrl;
                } else if (args.target === "season") {
                  var s = (col.seasons || []).find(function(x) { return Number(x.seasonNumber) === Number(args.seasonNumber); });
                  if (s) s.thumbnailUrl = dataUrl;
                }
                saveDB(db);
                return { ok: true, message: "Updated" };
              }

              if (action === "updatePlaybackProgress") {
                var colP = db.collections.find(function(c) { return Number(c.id) === Number(args.collectionId); });
                if (colP) {
                  var fl = (colP.files || []).find(function(x) { return Number(x.id) === Number(args.mediaFileId); });
                  if (fl) {
                    fl.positionSeconds = args.positionSeconds || 0;
                    fl.durationSeconds = args.durationSeconds || 0;
                    fl.completed = Boolean(args.completed);
                    saveDB(db);
                  }
                }
                return { ok: true };
              }

              if (action === "getOnlineAvailability") {
                var eq = encodeURIComponent(args.title || "");
                return {
                  checkedAt: new Date().toISOString(),
                  providers: [
                    { name: "Crunchyroll", url: "https://www.crunchyroll.com/search?q=" + eq, languages: ["Japanese (Sub)", "English (Dub)"] },
                    { name: "Netflix", url: "https://www.netflix.com/search?q=" + eq, languages: ["Japanese", "English"] },
                    { name: "YouTube", url: "https://www.youtube.com/results?search_query=" + eq, languages: ["Multiple"] }
