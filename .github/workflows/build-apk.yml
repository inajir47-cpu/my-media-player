name: Live Preview & Build Exact APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  live-web-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch hls.js for online anime playback
        run: curl -fsSL -o hls.min.js https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js


      - name: Build Patched Web App for Live Testing
        run: |
          mkdir -p www
          cp true-konosuba-player.txt raw.html

          # Build patch.js from parts (easier to manage than 6000+ line heredoc)
          cat .github/patches/*.js > patch.js
          echo "patch.js built: $(wc -l < patch.js) lines from $(ls .github/patches/*.js | wc -l) parts"

          node patch.js

      - name: Upload Web Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save Patched Web App for APK Job
        uses: actions/upload-artifact@v4
        with:
          name: patched-web-dir
          path: ./www/index.html

  build-apk:
    needs: live-web-preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Patched index.html
        uses: actions/download-artifact@v4
        with:
          name: patched-web-dir
          path: exact-app/www

      - name: Build Android APK with Fullscreen Cutout & Native PiP
        run: |
          cd exact-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Media Player" "com.exact.mediaplayer" --web-dir www
          rm -f capacitor.config.ts
          cat > capacitor.config.json << 'EOF_CAP'
          {
            "appId": "com.exact.mediaplayer",
            "appName": "Media Player",
            "webDir": "www",
            "plugins": {
              "CapacitorHttp": { "enabled": true }
            }
          }
          EOF_CAP
          npx cap add android
          npx cap sync android

          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'EOF_NSC'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="false">127.0.0.1</domain>
                  <domain includeSubdomains="false">localhost</domain>
              </domain-config>
          </network-security-config>
          EOF_NSC

          cat << 'EOF_MANIFEST' > patch-manifest.js
          const fs = require("fs");
          const mfPath = "android/app/src/main/AndroidManifest.xml";
          let mf = fs.readFileSync(mfPath, "utf8");
          mf = mf.replace(
            'android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"',
            'android:supportsPictureInPicture="true" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"'
          );
          mf = mf.replace(
            "<application",
            '<application android:networkSecurityConfig="@xml/network_security_config"'
          );
          fs.writeFileSync(mfPath, mf, "utf8");
          EOF_MANIFEST
          node patch-manifest.js


          cat << 'EOF_JAVA' > android/app/src/main/java/com/exact/mediaplayer/MainActivity.java
          package com.exact.mediaplayer;

          import android.app.PictureInPictureParams;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Rational;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.InetSocketAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.net.URL;
          import java.net.URLDecoder;

          public class MainActivity extends BridgeActivity {
              private boolean isVideoPlayerActive = false;
              private static final int STREAM_PROXY_PORT = 18923;
              private ServerSocket streamProxyServer = null;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  startStreamProxy();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      getWindow().getAttributes().layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }

                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().getSettings().setMixedContentMode(
                          android.webkit.WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      getBridge().getWebView().addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void setImmersive(boolean active) {
                              isVideoPlayerActive = active;
                              runOnUiThread(() -> applyImmersiveMode(active));
                          }

                          @JavascriptInterface
                          public void enterPiP() {
                              runOnUiThread(() -> triggerNativePiP());
                          }
                      }, "AndroidPiP");
                  }
              }

              @Override
              public void onBackPressed() {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      WebView webView = getBridge().getWebView();
                      webView.evaluateJavascript(
                          "(function() { return window.__handleAndroidBack ? window.__handleAndroidBack() : false; })()",
                          value -> {
                              if (!"true".equals(value)) {
                                  runOnUiThread(() -> MainActivity.super.onBackPressed());
                              }
                          }
                      );
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              public void onDestroy() {
                  try {
                      if (streamProxyServer != null) streamProxyServer.close();
                  } catch (Exception ignored) {}
                  super.onDestroy();
              }

              private void applyImmersiveMode(boolean fullscreen) {
                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (controller == null) return;
                  if (fullscreen) {
                      WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                      controller.hide(WindowInsetsCompat.Type.systemBars());
                      controller.setSystemBarsBehavior(
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      );
                  } else {
                      WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
                      controller.show(WindowInsetsCompat.Type.systemBars());
                  }
              }

              private void triggerNativePiP() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try {
                          PictureInPictureParams.Builder builder = new PictureInPictureParams.Builder();
                          builder.setAspectRatio(new Rational(16, 9));
                          enterPictureInPictureMode(builder.build());
                      } catch (Exception ignored) {}
                  }
              }

              @Override
              public void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  if (isVideoPlayerActive) {
                      triggerNativePiP();
                  }
              }

              private void startStreamProxy() {
                  Thread t = new Thread(() -> {
                      try {
                          streamProxyServer = new ServerSocket();
                          streamProxyServer.setReuseAddress(true);
                          streamProxyServer.bind(new InetSocketAddress("127.0.0.1", STREAM_PROXY_PORT));
                          final ServerSocket server = streamProxyServer;
                          android.util.Log.i("StreamProxy", "listening on 127.0.0.1:" + STREAM_PROXY_PORT);
                          while (!Thread.currentThread().isInterrupted()) {
                              final Socket client = server.accept();
                              new Thread(() -> handleProxyConnection(client)).start();
                          }
                      } catch (Exception e) {
                          android.util.Log.e("StreamProxy", "proxy error", e);
                      }
                  });
                  t.setDaemon(true);
                  t.start();
              }

              private static final java.util.Map<String, String> proxyCookieJar = new java.util.HashMap<String, String>();

              // Share cookies across subdomains of the same registrable domain
              // (e.g. a session cookie set on one subdomain must reach another).
              private String proxyCookieKey(String host) {
                  String[] labels = host.split("\\.");
                  if (labels.length >= 2) return labels[labels.length - 2] + "." + labels[labels.length - 1];
                  return host;
              }

              private String proxyReadLine(java.io.InputStream in) throws java.io.IOException {
                  StringBuilder sb = new StringBuilder();
                  int b;
                  while ((b = in.read()) != -1) {
                      if (b == '\n') break;
                      if (b != '\r') sb.append((char) b);
                  }
                  if (b == -1 && sb.length() == 0) return null;
                  return sb.toString();
              }

              private void handleProxyConnection(Socket client) {
                  try {
                      client.setSoTimeout(30000);
                      java.io.InputStream rawIn = client.getInputStream();
                      String requestLine = proxyReadLine(rawIn);
                      if (requestLine == null) { try { client.close(); } catch (Exception ignored) {} return; }
                      String[] parts = requestLine.split(" ");
                      if (parts.length < 2) { sendSimple(client, 400, "Bad Request"); try { client.close(); } catch (Exception ignored) {} return; }
                      String method = parts[0];
                      java.util.Map<String, String> reqHeaders = new java.util.LinkedHashMap<String, String>();
                      String line;
                      while ((line = proxyReadLine(rawIn)) != null && !line.isEmpty()) {
                          int colon = line.indexOf(':');
                          if (colon > 0) reqHeaders.put(line.substring(0, colon).trim(), line.substring(colon + 1).trim());
                      }
                      if (method.equals("OPTIONS")) {
                          sendOptions(client);
                          try { client.close(); } catch (Exception ignored) {} return;
                      }
                      boolean isPost = method.equals("POST");
                      if (!method.equals("GET") && !isPost) { sendSimple(client, 405, "Method Not Allowed"); try { client.close(); } catch (Exception ignored) {} return; }
                      String path = parts[1];
                      String upstream = null;
                      int q = path.indexOf("?u=");
                      if ((path.startsWith("/r") || path.startsWith("/p")) && q >= 0) {
                          String enc = path.substring(q + 3);
                          int amp = enc.indexOf('&');
                          if (amp >= 0) enc = enc.substring(0, amp);
                          try { upstream = URLDecoder.decode(enc, "UTF-8"); } catch (Exception ignored) {}
                      }
                      String xReferer = null, xOrigin = null;
                      int xrIdx = path.indexOf("&xreferer=");
                      if (xrIdx >= 0) {
                          String xrEnc = path.substring(xrIdx + 11);
                          int xrAmp = xrEnc.indexOf('&');
                          if (xrAmp >= 0) xrEnc = xrEnc.substring(0, xrAmp);
                          try { xReferer = URLDecoder.decode(xrEnc, "UTF-8"); } catch (Exception ignored) {}
                      }
                      int xoIdx = path.indexOf("&xorigin=");
                      if (xoIdx >= 0) {
                          String xoEnc = path.substring(xoIdx + 9);
                          int xoAmp = xoEnc.indexOf('&');
                          if (xoAmp >= 0) xoEnc = xoEnc.substring(0, xoAmp);
                          try { xOrigin = URLDecoder.decode(xoEnc, "UTF-8"); } catch (Exception ignored) {}
                      }
                      if (upstream == null || !(upstream.startsWith("http://") || upstream.startsWith("https://"))) {
                          sendSimple(client, 400, "Bad Request");
                          try { client.close(); } catch (Exception ignored) {} return;
                      }
                      byte[] postBody = null;
                      if (isPost) {
                          int contentLen = 0;
                          for (java.util.Map.Entry<String, String> e : reqHeaders.entrySet()) {
                              if (e.getKey().equalsIgnoreCase("Content-Length")) {
                                  try { contentLen = Integer.parseInt(e.getValue().trim()); } catch (Exception ignored) {}
                              }
                          }
                          if (contentLen > 0 && contentLen < 8 * 1024 * 1024) {
                              postBody = new byte[contentLen];
                              int off = 0;
                              while (off < contentLen) {
                                  int n = rawIn.read(postBody, off, contentLen - off);
                                  if (n <= 0) break;
                                  off += n;
                              }
                          }
                      }
                      forwardUpstream(client, method, upstream, reqHeaders, postBody, xReferer, xOrigin);
                      try { client.close(); } catch (Exception ignored) {}
                  } catch (Exception e) {
                      try { client.close(); } catch (Exception ignored) {}
                  }
              }

              private void sendOptions(Socket client) {
                  try {
                      String head = "HTTP/1.1 200 OK\r\n" +
                          "Access-Control-Allow-Origin: *\r\n" +
                          "Access-Control-Allow-Methods: GET, POST, OPTIONS\r\n" +
                          "Access-Control-Allow-Headers: *\r\n" +
                          "Content-Length: 0\r\n" +
                          "Connection: close\r\n\r\n";
                      OutputStream out = client.getOutputStream();
                      out.write(head.getBytes("UTF-8"));
                      out.flush();
                  } catch (Exception ignored) {}
              }

              private void sendSimple(Socket client, int status, String text) {
                  try {
                      byte[] body = text.getBytes("UTF-8");
                      String head = "HTTP/1.1 " + status + " " + text + "\r\n" +
                          "Content-Type: text/plain\r\n" +
                          "Content-Length: " + body.length + "\r\n" +
                          "Access-Control-Allow-Origin: *\r\n" +
                          "Connection: close\r\n\r\n";
                      OutputStream out = client.getOutputStream();
                      out.write(head.getBytes("UTF-8"));
                      out.write(body);
                      out.flush();
                  } catch (Exception ignored) {}
              }

              private boolean proxyHasHeader(java.util.Map<String, String> headers, String name) {
                  for (String k : headers.keySet()) if (k.equalsIgnoreCase(name)) return true;
                  return false;
              }

              private void proxyStoreCookies(String host, HttpURLConnection conn) {
                  try {
                      java.util.Map<String, java.util.List<String>> fields = conn.getHeaderFields();
                      if (fields == null) return;
                      for (java.util.Map.Entry<String, java.util.List<String>> e : fields.entrySet()) {
                          if (e.getKey() == null || !e.getKey().equalsIgnoreCase("Set-Cookie")) continue;
                          for (String sc : e.getValue()) {
                              int semi = sc.indexOf(';');
                              String nv = (semi >= 0 ? sc.substring(0, semi) : sc).trim();
                              int eq = nv.indexOf('=');
                              if (eq <= 0) continue;
                              String cname = nv.substring(0, eq).trim();
                              String cval = nv.substring(eq + 1).trim();
                              synchronized (proxyCookieJar) {
                                  String ckey = proxyCookieKey(host);
                                  String prev = proxyCookieJar.get(ckey);
                                  String merged = cname + "=" + cval;
                                  if (prev != null && !prev.isEmpty()) {
                                      String[] cparts = prev.split("; ");
                                      StringBuilder sb2 = new StringBuilder();
                                      for (String p : cparts) {
                                          if (p.startsWith(cname + "=")) continue;
                                          if (sb2.length() > 0) sb2.append("; ");
                                          sb2.append(p);
                                      }
                                      if (sb2.length() > 0) sb2.append("; ");
                                      sb2.append(merged);
                                      merged = sb2.toString();
                                  }
                                  proxyCookieJar.put(ckey, merged);
                              }
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private void forwardUpstream(Socket client, String method, String upstream,
                                           java.util.Map<String, String> reqHeaders, byte[] postBody,
                                           String xReferer, String xOrigin) {
                  HttpURLConnection conn = null;
                  try {
                      URL url = new URL(upstream);
                      String host = url.getHost().toLowerCase();
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod(method);
                      conn.setConnectTimeout(15000);
                      conn.setReadTimeout(30000);
                      conn.setInstanceFollowRedirects(true);
                      conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36");
                      for (java.util.Map.Entry<String, String> e : reqHeaders.entrySet()) {
                          String k = e.getKey();
                          String lk = k.toLowerCase();
                          if (lk.equals("host") || lk.equals("content-length") || lk.equals("connection") ||
                              lk.equals("origin") || lk.equals("referer") || lk.equals("cookie") || lk.equals("accept-encoding") ||
                              lk.startsWith("proxy-") || lk.startsWith("sec-")) continue;
                          try { conn.setRequestProperty(k, e.getValue()); } catch (Exception ignored) {}
                      }
                      boolean isFlixHost = host.indexOf("flixcloud") >= 0;
                      if (isFlixHost) {
                          conn.setRequestProperty("Referer", "https://flixcloud.cc/");
                          conn.setRequestProperty("Origin", "https://flixcloud.cc");
                      } else {
                          if (xReferer != null && !xReferer.isEmpty()) conn.setRequestProperty("Referer", xReferer);
                          if (xOrigin != null && !xOrigin.isEmpty()) conn.setRequestProperty("Origin", xOrigin);
                      }
                      String jarCookie;
                      synchronized (proxyCookieJar) { jarCookie = proxyCookieJar.get(proxyCookieKey(host)); }
                      if (jarCookie != null && !jarCookie.isEmpty()) conn.setRequestProperty("Cookie", jarCookie);
                      if (postBody != null && postBody.length > 0) {
                          conn.setDoOutput(true);
                          if (!proxyHasHeader(reqHeaders, "Content-Type")) conn.setRequestProperty("Content-Type", "application/json");
                          OutputStream cos = conn.getOutputStream();
                          cos.write(postBody);
                          cos.flush();
                          cos.close();
                      }
                      int status = conn.getResponseCode();
                      if (status < 100) {
                          sendSimple(client, 502, "Bad Gateway");
                          return;
                      }
                      proxyStoreCookies(host, conn);
                      String contentType = conn.getContentType();
                      if (contentType == null) contentType = "application/octet-stream";
                      InputStream in;
                      try {
                          in = conn.getInputStream();
                      } catch (IOException e) {
                          in = conn.getErrorStream();
                      }
                      OutputStream out = client.getOutputStream();
                      String statusText;
                      if (status == 200) statusText = "OK";
                      else if (status == 206) statusText = "Partial Content";
                      else statusText = "Upstream " + status;
                      StringBuilder head = new StringBuilder();
                      head.append("HTTP/1.1 ").append(status).append(' ').append(statusText).append("\r\n");
                      head.append("Content-Type: ").append(contentType).append("\r\n");
                      head.append("Access-Control-Allow-Origin: *\r\n");
                      head.append("Access-Control-Allow-Headers: *\r\n");
                      head.append("Access-Control-Expose-Headers: x-token\r\n");
                      String xToken = conn.getHeaderField("x-token");
                      if (xToken != null) head.append("x-token: ").append(xToken).append("\r\n");
                      String contentRange = conn.getHeaderField("Content-Range");
                      if (contentRange != null) head.append("Content-Range: ").append(contentRange).append("\r\n");
                      String acceptRanges = conn.getHeaderField("Accept-Ranges");
                      if (acceptRanges != null) head.append("Accept-Ranges: ").append(acceptRanges).append("\r\n");
                      String contentEncoding = conn.getHeaderField("Content-Encoding");
                      if (contentEncoding != null) head.append("Content-Encoding: ").append(contentEncoding).append("\r\n");
                      head.append("Transfer-Encoding: chunked\r\n");
                      head.append("Connection: close\r\n\r\n");
                      out.write(head.toString().getBytes("UTF-8"));
                      if (in != null) {
                          byte[] buf = new byte[16384];
                          int n;
                          while ((n = in.read(buf)) != -1) {
                              out.write(Integer.toHexString(n).getBytes("UTF-8"));
                              out.write("\r\n".getBytes("UTF-8"));
                              out.write(buf, 0, n);
                              out.write("\r\n".getBytes("UTF-8"));
                          }
                          in.close();
                      }
                      out.write("0\r\n\r\n".getBytes("UTF-8"));
                      out.flush();
                  } catch (Exception e) {
                      sendSimple(client, 502, "Bad Gateway");
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }
          }

          EOF_JAVA

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Exact APK
        uses: actions/upload-artifact@v4
        with:
          name: Exact-Media-Player-APK
          path: "**/android/app/build/outputs/apk/debug/*.apk"
