name: Live Preview & Build Exact APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  live-web-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch hls.js for online anime playback
        run: curl -fsSL -o hls.min.js https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js

      - name: Fetch hanime signature files
        run: |
          curl -fsSL -o vendor.js https://raw.githubusercontent.com/varomine/hanime.tv-api/2fc680d9985f96cf310bf8a68fa0e3ddb431cb43/src/vendor.js
          curl -fsSL -o signature.wasm https://raw.githubusercontent.com/varomine/hanime.tv-api/2fc680d9985f96cf310bf8a68fa0e3ddb431cb43/src/signature.wasm
          ls -la vendor.js signature.wasm

      - name: Build Patched Web App for Live Testing
        run: |
          mkdir -p www
          cp true-konosuba-player.txt raw.html

          cat << 'EOF_PATCH' > patch.js
          const fs = require("fs");
          let html = fs.readFileSync("raw.html", "utf8");

          // 1. Remove Muse iframe bridge scripts
          html = html.replace(/<script data-hatch-cvm-opaque-url-compat[\s\S]*?<\/script>/, "");
          html = html.replace(/<script data-hatch-cvm-bridge[\s\S]*?<\/script>/, "");

          // 2. Clear static HTML snapshot so React mounts cleanly
          html = html.replace(
            /(<div class="hatch-space-root" data-hatch-space-root="true">)[\s\S]*?(<\/div><\/div>\s*<script data-hatch-cvm-bundle)/,
            "$1$2"
          );

          // 3. Patch IndexedDB & localMedia in bundle to key by (webkitRelativePath || name)
          html = html.replace(
            /for \(let r of e\) n\.put\(\{[\s\S]*?savedAt: Date\.now\(\)\s*\}\);/,
            'for (let r of e) { let k = window.__getMediaFileKey ? window.__getMediaFileKey(r) : (r.webkitRelativePath || r.name); n.put({ name: k, rawName: r.name, relativePath: r.webkitRelativePath || null, type: r.type, blob: r, savedAt: Date.now() }); if (k !== r.name) n.put({ name: r.name, rawName: r.name, relativePath: r.webkitRelativePath || null, type: r.type, blob: r, savedAt: Date.now() }); }'
          );

          html = html.replace(
            /for \(let f of N\) \{[\s\S]*?fileName: f\.name\s*\}\);\s*\}/,
            'for (let f of N) { let k = window.__getMediaFileKey ? window.__getMediaFileKey(f) : (f.webkitRelativePath || f.name); let objUrl = URL.createObjectURL(f); let entry = { url: objUrl, mimeType: f.type || (f.name.match(/\\.(mp3|m4a|wav|flac)$/i) ? "audio/mpeg" : "video/mp4"), fileName: k }; ve.set(k, entry); if (!ve.has(f.name)) ve.set(f.name, entry); }'
          );

          // 4. Patch Add Sheet (yb) file input to deduplicate by (folder + fileName) and suggest title
          html = html.replace(
            /u\("input",\s*\{\s*"aria-label":\s*"Choose local media files"[\s\S]*?onChange:\s*m\s*=>\s*g\(Array\.from\(m\.target\.files\s*\?\?\s*\[\]\)\)\s*\}\)/,
            'u("input", { "aria-label": "Choose local media files", type: "file", multiple: !0, accept: "video/*,audio/*,.mkv,.mp3,.flac,.m4a,.wav", onChange: m => { var incoming = Array.from(m.target.files ?? []).filter(f => /\\.(mp4|mkv|webm|mov|m4v|avi|mp3|flac|m4a|wav|ogg)$/i.test(f.name) || (f.type && (f.type.startsWith("video/") || f.type.startsWith("audio/")))); if (incoming.length === 0) return; g(prev => window.__mergeUniquePickerFiles ? window.__mergeUniquePickerFiles(prev, incoming) : incoming); var suggested = window.__suggestTitleFromFiles ? window.__suggestTitleFromFiles(incoming) : ""; if (suggested) { window.__lastSuggestedTitle = suggested; r(curr => curr.trim() ? curr : suggested); } m.target.value = ""; } })'
          );

          // 5. Add editable title suggestion bar right below the title input
          html = html.replace(
            /u\("input",\s*\{\s*"aria-label":\s*"Collection title"[\s\S]*?required:\s*!0\s*\}\)/,
            'u("input", { "aria-label": "Collection title", value: n, onChange: m => r(m.target.value), placeholder: i === "series" ? "e.g. KonoSuba" : i === "movie" ? "e.g. Dune: Part Two" : "e.g. Night drive", required: !0 }), c.length > 0 && window.__suggestTitleFromFiles && (() => { var sug = window.__suggestTitleFromFiles(c); return sug ? v("div", { className: "title-suggestion-bar", children: [v("span", { children: ["Suggested: ", u("strong", { children: sug })] }), n.trim() !== sug ? u("button", { type: "button", className: "suggestion-apply-btn", onClick: () => r(sug), children: "Use title" }) : u("small", { className: "suggestion-active-note", children: "✓ Editable above" })] }) : null; })()'
          );

          // 6. Add One-Tap Folder Picker button and updated file summary
          html = html.replace(
            /c\.length > 0 && v\("p",\s*\{\s*className:\s*"file-summary"[\s\S]*?matched automatically\."\]\s*\}\)/,
            'v("div", { className: "folder-picker-row", children: [v("label", { className: "secondary-action folder-pick-btn", children: [u(k, { name: "folder", size: 17 }), " Pick entire folder in one tap", u("input", { type: "file", webkitdirectory: "", directory: "", multiple: !0, className: "sr-only", onChange: m => { var incoming = Array.from(m.target.files ?? []).filter(f => /\\.(mp4|mkv|webm|mov|m4v|avi|mp3|flac|m4a|wav|ogg)$/i.test(f.name) || (f.type && (f.type.startsWith("video/") || f.type.startsWith("audio/")))); if (incoming.length === 0) return; g(prev => window.__mergeUniquePickerFiles ? window.__mergeUniquePickerFiles(prev, incoming) : incoming); var suggested = window.__suggestTitleFromFiles ? window.__suggestTitleFromFiles(incoming) : ""; if (suggested) { window.__lastSuggestedTitle = suggested; r(curr => curr.trim() ? curr : suggested); } m.target.value = ""; } })] }), c.length > 0 && u("button", { type: "button", className: "secondary-action clear-files-btn", onClick: () => g([]), children: "Clear" })] }), c.length > 0 && v("p", { className: "file-summary", children: [u("strong", { children: c.length }), " unique local ", c.length === 1 ? "file" : "files", " ready (checked by folder + filename). Same title merges into one entry."] })'
          );

          // 7. Episode & Watch Order UI enhancements (listed count + arrive date)
          html = html.replace(
            /children:\s*\[u\("h3",\s*\{\s*children:\s*r\s*==\s*null\s*\?\s*"Episodes"\s*:\s*ve\(r\)\s*\}\)/,
            'children: [u("h3", { children: (r == null ? "Episodes" : ve(r)) + (U.length > 0 ? ` · ${U.length} listed` : " · 0 listed") })'
          );

          html = html.replace(
            /oa = f\.kind === "season" \? `\$\{S\.episodes\.filter\(I => I\.seasonNumber === f\.season\.seasonNumber\)\.length\} episodes` : f\.kind === "related" \? f\.related\.title : f\.file\.displayTitle;/,
            'oa = f.kind === "season" ? (f.season.statusText ? `${f.season.statusText} · ${S.episodes.filter(I => I.seasonNumber === f.season.seasonNumber).length} listed` : `${S.episodes.filter(I => I.seasonNumber === f.season.seasonNumber).length} episodes listed`) : f.kind === "related" ? (f.related.statusText ? `${f.related.statusText} · ${f.related.title}` : f.related.title) : f.file.displayTitle;'
          );

          html = html.replace(
            /children:\s*\[f\.runtimeMinutes\s*\?\s*`\$\{f\.runtimeMinutes\}\s*min`[\s\S]*?" · No local file"\]/,
            'children: [f.arriveDate ? (f.isUpcoming ? `Arrives ${f.arriveDate} · ` : `${f.arriveDate} · `) : "", f.airStatus ? f.airStatus : (f.runtimeMinutes ? `${f.runtimeMinutes} min` : "24 min"), X ? (Oe ? (C && C.positionSeconds > 3 && !C.completed ? " · Resume" : " · Ready to play") : " · Reconnect file") : (f.isUpcoming ? " · Coming soon" : " · No local file")]'
          );

          html = html.replace(
            /return `Season \$\{lt\.get\(f\) \?\? f\}\$\{C\?\.releaseYear \? ` \(\$\{C\.releaseYear\}\)` : ""\}`;/,
            'return `Season ${lt.get(f) ?? f}${C?.releaseYear ? ` (${C.releaseYear})` : ""}${C?.badgeText ? ` · ${C.badgeText}` : ""}`;'
          );

          html = html.replace(
            '"No episode list was found for this season. Your imported files are still kept."',
            '(Me.find(ae => ae.seasonNumber === r)?.isComingSoon ? "⏳ Coming Soon — This season has been announced and has not started airing yet." : "No episode list was found for this season. Your imported files are still kept.")'
          );

          // 8. Auto-select the Season where the user left off when opening a Series detail page
          html = html.replace(
            'if (r == null && D[0] != null) o(D[0]);',
            'if (r == null && D[0] != null) { var lastWatchedSeason = window.__getLastWatchedSeason ? window.__getLastWatchedSeason(S) : null; o(lastWatchedSeason != null && D.includes(lastWatchedSeason) ? lastWatchedSeason : D[0]); }'
          );

          // 9. Add "Continue Watching (S01 E02)" button inside Series / Movie Detail Hero Actions
          html = html.replace(
            /_\s*\[0\]\s*&&\s*v\("button",\s*\{\s*className:\s*"primary-action"[\s\S]*?"Play local file"\]\s*\}\)/,
            '(window.__renderDetailContinueButton ? window.__renderDetailContinueButton(S, i, o, c, u, v, k) : null)'
          );

          // 10. Add "History" tab button to Top Navigation Bar
          html = html.replace(
            /u\("button",\s*\{\s*className:\s*a\s*===\s*"music"\s*\?\s*"active"\s*:\s*"",\s*onClick:\s*\(\)\s*=>\s*i\("music"\),\s*children:\s*"Music"\s*\}\)/,
            'u("button", { className: a === "music" ? "active" : "", onClick: () => i("music"), children: "Music" }), u("button", { className: a === "history" ? "active" : "", onClick: () => i("history"), children: "History" })'
          );

          // 11. Inject "Continue Watching" rail BEFORE "Series collections" on Home AND full "History" tab view
          html = html.replace(
            'u("div", {\n          className: "rail-stack",',
            '(window.__renderContinueAndHistory ? window.__renderContinueAndHistory({ activeTab: a, setTab: i, searchQuery: e, cwItems: A.data?.items ?? [], collections: R, onPlay: ra, onOpenCollection: o, u: u, v: v, k: k }) : null), a !== "history" && u("div", {\n          className: "rail-stack",'
          );

          // 11b. Merge watched online series/movies INTO the native Series collections / Movies rows
          html = html.replace(
            'children: [["series", "Series collections", U], ["movie", "Movies", _], ["music", "Music", ue]]',
            'children: [["series", "Series collections", window.__onlineCols ? U.concat(window.__onlineCols("series")) : U], ["movie", "Movies", window.__onlineCols ? _.concat(window.__onlineCols("movie")) : _], ["music", "Music", ue]]'
          );

          // 11c. Route taps on online collection cards to the online detail page
          html = html.replace(
            'onOpen: () => o(f.id),',
            'onOpen: () => { window.__nativeOpenCollection = o; var __fid = String((f && f.id) || ""); if (__fid.indexOf("online:") === 0) { if (window.__openOnlineCol) window.__openOnlineCol(__fid.slice(7)); } else { o(f.id); } },'
          );

          // 12. Hero Carousel 2+2+2 rule: 2 Recently Added + 2 Recently Watched (+ 2 Newly Launched injected separately)
          html = html.replace(
            'Me = [...R].sort((N, q) => Date.parse(q.createdAt) - Date.parse(N.createdAt)).slice(0, 3),\n    lt = (A.data?.items ?? []).slice(0, 2),',
            'Me = [...R].sort((N, q) => Date.parse(q.createdAt) - Date.parse(N.createdAt)).slice(0, 2),\n    lt = (function(){ var local=(A.data?.items ?? []).slice(); try{ var oh=JSON.parse(localStorage.getItem("__online_history_v1")||"[]"); var seen={}; local.forEach(function(x){ if(x&&x.collectionId) seen[String(x.collectionId)]=1; }); oh.forEach(function(o){ var k="online:"+(o.animeId||""); if(o&&o.animeId&&!seen[k]){ seen[k]=1; local.push({ collectionId:k, collectionTitle:o.title, displayTitle:(o.title||"")+" E"+(o.ep||""), lastWatchedAt:o.lastWatchedAt||0, posterUrl:o.poster||null }); } }); }catch(e){} local.sort(function(a,b){ return (b.lastWatchedAt||0)-(a.lastWatchedAt||0); }); return local; })().slice(0, 2),'
          );

          html = html.replace(
            'onMouseEnter: () => y(!0),\n            onMouseLeave: () => y(!1),',
            'onMouseEnter: () => y(!0),\n            onMouseLeave: () => y(!1),\n            onTouchStart: X => { y(!0); if (window.__carouselTouchStart) window.__carouselTouchStart(X); },\n            onTouchMove: X => { if (window.__carouselTouchMove) window.__carouselTouchMove(X); },\n            onTouchEnd: X => { y(!1); if (window.__carouselTouchEnd) window.__carouselTouchEnd(X, me.length, b); },\n            onTouchCancel: X => { y(!1); if (window.__carouselTouchCancel) window.__carouselTouchCancel(X); },'
          );

          html = html.replace(
            'onClick: () => {\n        if (r && !t) i();else l();\n      },',
            'onClick: () => { l(); },'
          );

          // 12b. Inject 2 Newly Launched Online anime into Hero Carousel (2+2+2 rule)
          html = html.replace(
            '</body>',
            `<script>
            (function(){
              function fetchNewlyLaunched(){
                var q = 'query { Page(page:1, perPage:10){ media(type:ANIME, status:RELEASING, sort:START_DATE_DESC){ id title{ romaji english } coverImage{ large } startDate{ year } } } }';
                return fetch('https://graphql.anilist.co', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query:q}) })
                  .then(function(r){ return r.json(); })
                  .then(function(d){
                    var list = ((d.data||{}).Page||{}).media||[];
                    return list.slice(0,2).map(function(m){
                      return { title:(m.title.english||m.title.romaji||'Unknown'), anilistId:m.id, image:(m.coverImage||{}).large||null, year:(m.startDate||{}).year||null, _newlyLaunched:true };
                    });
                  }).catch(function(){ return []; });
              }
              function injectSlides(items){
                if(!items.length) return;
                // Find carousel container
                var car = document.querySelector('.home-carousel, [class*="carousel"]');
                if(!car) { setTimeout(function(){ injectSlides(items); }, 2000); return; }
                // Deduplicate: skip if title already in carousel
                var existing = {};
                car.querySelectorAll('[class*="title"], [class*="heading"]').forEach(function(el){
                  existing[el.textContent.trim().toLowerCase()] = 1;
                });
                items.forEach(function(item){
                  var key = String(item.title).toLowerCase();
                  if(existing[key]) return;
                  existing[key] = 1;
                  // Create slide element (simplified - will be styled by existing CSS)
                  var slide = document.createElement('div');
                  slide.className = 'carousel-slide newly-launched-online';
                  slide.innerHTML = '<div class="newly-launched-badge">Newly Launched \u00B7 Online</div>' +
                    (item.image ? '<img src="'+item.image+'" alt="" />' : '') +
                    '<div class="slide-title">'+item.title+'</div>';
                  slide.onclick = function(){ if(window.openOnlineAsNative) window.openOnlineAsNative(item); };
                  car.appendChild(slide);
                });
              }
              // Wait for app to load, then fetch and inject
              setTimeout(function(){ fetchNewlyLaunched().then(injectSlides); }, 5000);
            })();
            </script>
            <script>
            // AnimeThemes direct trailer fetch (raw .webm, no YouTube errors)
            window.__trailerCache = window.__trailerCache || {};
            async function fetchTrailerUrl(anilistId, title) {
              var cacheKey = anilistId || title;
              if (!cacheKey) return null;
              if (window.__trailerCache[cacheKey]) return window.__trailerCache[cacheKey];
              try {
                var url = null;
                // Primary: by AniList ID
                if (anilistId) {
                  var apiUrl = 'https://api.animethemes.moe/anime?filter[has]=resources&filter[site]=AniList&filter[external_id]=' + anilistId + '&include=animethemes.animethemeentries.videos';
                  var res = await fetch(apiUrl);
                  var data = await res.json();
                  var anime = (data.anime && data.anime[0]) || null;
                  if (anime && anime.animethemes) {
                    for (var i = 0; i < anime.animethemes.length && !url; i++) {
                      var entries = anime.animethemes[i].animethemeentries || [];
                      for (var j = 0; j < entries.length && !url; j++) {
                        var videos = entries[j].videos || [];
                        for (var k = 0; k < videos.length && !url; k++) {
                          if (videos[k].link && videos[k].link.indexOf('.webm') > 0) url = videos[k].link;
                        }
                      }
                    }
                  }
                }
                // Fallback: by title search
                if (!url && title) {
                  var searchUrl = 'https://api.animethemes.moe/search?q=' + encodeURIComponent(title) + '&fields[search]=anime&include[anime]=animethemes.animethemeentries.videos';
                  var sres = await fetch(searchUrl);
                  var sdata = await sres.json();
                  var sanime = (sdata.search && sdata.search.anime && sdata.search.anime[0]) || null;
                  if (sanime && sanime.animethemes) {
                    for (var a = 0; a < sanime.animethemes.length && !url; a++) {
                      var aentries = sanime.animethemes[a].animethemeentries || [];
                      for (var b = 0; b < aentries.length && !url; b++) {
                        var avideos = aentries[b].videos || [];
                        for (var c = 0; c < avideos.length && !url; c++) {
                          if (avideos[c].link && avideos[c].link.indexOf('.webm') > 0) url = avideos[c].link;
                        }
                      }
                    }
                  }
                }
                if (url) window.__trailerCache[cacheKey] = url;
                return url;
              } catch(e) { return null; }
            }
            // Save trailer URL to collection in DB
            function saveTrailerToCollection(collectionId, trailerUrl) {
              try {
                var db = JSON.parse(localStorage.getItem('media_player_exact_db_v5') || '{}');
                var col = (db.collections || []).find(function(c){ return String(c.id) === String(collectionId); });
                if (col && trailerUrl) {
                  col.trailerVideoUrl = trailerUrl;
                  localStorage.setItem('media_player_exact_db_v5', JSON.stringify(db));
                }
              } catch(e) {}
            }
            </script>
            <script>
            // Online video fallback for Hero background preview (when no local file)
            (function(){
              var activeStream = null;
              function tryOnlinePreview(){
                var preview = document.querySelector('.local-clip-preview');
                if(!preview) return;
                // Check if already has a video playing or online preview active
                if(preview.querySelector('video') || preview.dataset.onlineActive) return;
                // Check for empty state (no local video)
                var emptyMsg = preview.textContent || '';
                if(emptyMsg.indexOf('No local') < 0 && emptyMsg.indexOf('not connected') < 0 && preview.children.length > 0) return;
                // Try to get current slide's anime info
                var slide = document.querySelector('.carousel-slide.active, .home-carousel .active');
                if(!slide) return;
                var titleEl = slide.querySelector('.slide-title, [class*="title"]');
                if(!titleEl) return;
                var title = titleEl.textContent.trim();
                if(!title) return;
                // Mark as attempting to avoid loops
                preview.dataset.onlineActive = '1';
                // Hide empty placeholder
                preview.innerHTML = '';
                preview.style.background = '#000';
                var anilistId = slide.dataset.anilistId || null;
                // Try AnimeThemes direct trailer first (raw .webm, no YouTube errors)
                fetchTrailerUrl(anilistId, title).then(function(trailerUrl){
                  if (trailerUrl) {
                    playTrailerPreview(preview, trailerUrl);
                  } else if (anilistId && window.dWatch) {
                    // Fallback: EP1 stream via dWatch
                    window.dWatch(anilistId, 1).then(function(url){ playPreview(preview, url); })
                      .catch(function(){ preview.dataset.onlineActive=''; });
                  } else if (window.dWatch) {
                    fetch('https://reanime.to/api/v1/search?q='+encodeURIComponent(title)+'&limit=1')
                      .then(function(r){ return r.json(); })
                      .then(function(d){
                        var res = (d.results||[])[0];
                        if(res && res.anilistId && window.dWatch){
                          return window.dWatch(res.anilistId, 1).then(function(url){
                            playPreview(preview, url);
                          });
                        }
                      }).catch(function(){ preview.dataset.onlineActive=''; });
                  } else {
                    preview.dataset.onlineActive='';
                  }
                });
              }
              // Play AnimeThemes trailer (muted, loop, with unmute toggle)
              function playTrailerPreview(preview, url){
                window.playTrailerPreview = playTrailerPreview;
                if(!url) { preview.dataset.onlineActive=''; return; }
                var v = document.createElement('video');
                v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true;
                v.style.cssText = 'width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease;';
                v.src = url;
                preview.appendChild(v);
                // Mute/unmute toggle
                var muteBtn = document.createElement('button');
                muteBtn.innerHTML = '&#128263;';
                muteBtn.style.cssText = 'position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:18px;width:40px;height:40px;border-radius:50%;cursor:pointer;z-index:10;';
                muteBtn.onclick = function(e){ e.stopPropagation(); v.muted = !v.muted; muteBtn.innerHTML = v.muted ? '&#128263;' : '&#128266;'; };
                preview.style.position = 'relative';
                preview.appendChild(muteBtn);
                v.play().catch(function(){});
                v.onplaying = function(){ v.style.opacity='1'; };
                v.onerror = function(){ preview.dataset.onlineActive=''; };
              }
              function playPreview(preview, url){
                if(!url) { preview.dataset.onlineActive=''; return; }
                var v = document.createElement('video');
                v.muted = true; v.loop = true; v.playsInline = true;
                v.style.cssText = 'width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease;';
                preview.appendChild(v);
                if(window.Hls && window.Hls.isSupported() && url.indexOf('.m3u8')>=0){
                  var hls = new window.Hls();
                  hls.loadSource(url); hls.attachMedia(v);
                  hls.on(window.Hls.Events.MANIFEST_PARSED, function(){ v.play().catch(function(){}); });
                } else {
                  v.src = url;
                  v.play().catch(function(){});
                }
                v.onplaying = function(){ v.style.opacity='1'; };
                // Play 30s preview then fade
                setTimeout(function(){
                  v.style.opacity='0';
                  setTimeout(function(){ v.pause(); preview.dataset.onlineActive=''; }, 1000);
                }, 30000);
                activeStream = v;
              }
              // Check periodically for empty preview states
              setInterval(tryOnlinePreview, 3000);
            })();
            </script>
            <script>
            // OVA Episode Count & Episode Grid Enhancement for Watch Order
            (function(){
              function getRelatedMedia() {
                try {
                  var dbRaw = localStorage.getItem('media_player_exact_db_v5');
                  var db = dbRaw ? JSON.parse(dbRaw) : null;
                  // Find current collection from URL or active detail
                  var hash = window.location.hash || '';
                  var m = hash.match(/collection\/(\d+)/) || hash.match(/(\d+)/);
                  if (!m || !db) return null;
                  var col = db.collections.find(function(c){ return String(c.id) === m[1]; });
                  return col ? col.relatedMedia || [] : [];
                } catch(e) { return []; }
              }
              function enhanceWatchOrder() {
                var related = getRelatedMedia();
                if (!related.length) return;
                // Find watch order cards
                document.querySelectorAll('.watch-order-card').forEach(function(card){
                  if (card.dataset.ovaEnhanced) return;
                  var titleEl = card.querySelector('[class*="title"]');
                  if (!titleEl) return;
                  var title = titleEl.textContent.trim();
                  var rm = related.find(function(r){
                    return r.title && title.toLowerCase().indexOf(r.title.toLowerCase().slice(0, 20)) >= 0;
                  });
                  if (rm && (rm.contentType === 'ova' || rm.contentType === 'special') && rm.episodeCount > 1) {
                    card.dataset.ovaEnhanced = '1';
                    // Add episode count badge
                    var badge = document.createElement('span');
                    badge.className = 'ova-ep-count';
                    badge.style.cssText = 'background:#7c3aed;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:8px;';
                    badge.textContent = rm.episodeCount + ' episodes';
                    titleEl.appendChild(badge);
                  }
                });
                // Enhance related-detail header with episode count
                document.querySelectorAll('[class*="related-detail"], [class*="relatedDetail"]').forEach(function(detail){
                  if (detail.dataset.ovaEnhanced) return;
                  var typeEl = detail.querySelector('p[class*="related-type"], .related-type');
                  if (!typeEl) return;
                  var titleEl = detail.querySelector('h2, h3, [class*="title"]');
                  var title = titleEl ? titleEl.textContent.trim() : '';
                  var rm = related.find(function(r){
                    return r.title && title.toLowerCase().indexOf(r.title.toLowerCase().slice(0, 20)) >= 0;
                  });
                  if (rm && (rm.contentType === 'ova' || rm.contentType === 'special') && rm.episodeCount) {
                    detail.dataset.ovaEnhanced = '1';
                    // Update header to include episode count
                    if (typeEl.textContent.indexOf('EPISODE') < 0) {
                      typeEl.textContent = typeEl.textContent.replace(/·\s*$/, '') + ' · ' + rm.episodeCount + ' EPISODES';
                    }
                    // Render episode grid below info box
                    if (rm.episodes && rm.episodes.length > 1 && !detail.querySelector('.ova-ep-grid')) {
                      var grid = document.createElement('div');
                      grid.className = 'ova-ep-grid';
                      grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:16px;padding:0 16px;';
                      grid.innerHTML = '<div style="grid-column:1/-1;font-weight:600;margin-bottom:4px;">Episodes · ' + rm.episodes.length + ' listed</div>' +
                        rm.episodes.map(function(e){
                          return '<button type="button" class="ova-ep-card" data-ep="' + e.number + '" data-title="' + rm.title.replace(/"/g, '&quot;') + '" ' +
                            'style="background:#1a1d24;border:1px solid #2a2e38;border-radius:8px;padding:12px;cursor:pointer;color:#fff;text-align:left;">' +
                            '<div style="font-weight:600;">EP ' + String(e.number).padStart(2, '0') + '</div>' +
                            '<div style="font-size:12px;opacity:0.7;margin-top:4px;">' + e.title + '</div>' +
                            '<div style="font-size:11px;color:#7c3aed;margin-top:8px;">🌐 Watch online</div>' +
                            '</button>';
                        }).join('');
                      detail.appendChild(grid);
                      // Wire episode buttons
                      grid.querySelectorAll('.ova-ep-card').forEach(function(btn){
                        btn.onclick = function(){
                          var epNum = parseInt(btn.getAttribute('data-ep'), 10);
                          var t = btn.getAttribute('data-title');
                          if (window.autoPlayOnline) window.autoPlayOnline(t, epNum, 'ova', {direct:true});
                        };
                      });
                    }
                  }
                });
              }
              // Run periodically to catch dynamically rendered content
              setInterval(enhanceWatchOrder, 2000);
              // Also run on hash change (navigation)
              window.addEventListener('hashchange', function(){ setTimeout(enhanceWatchOrder, 500); });
            })();
            </script>
            <script>
            // Discover Tab - Dubbed Anime by Genre with 48h cache
            (function(){
              var CACHE_KEY = '__discover_feed_cache_v1';
              var CACHE_TTL = 48 * 60 * 60 * 1000; // 48 hours
              
              var GENRES = [
                { name: 'Isekai', query: 'Isekai', anilistGenre: null, anilistTag: 'Isekai' },
                { name: 'Romance', query: 'Romance', anilistGenre: 'Romance', anilistTag: null },
                { name: 'Action', query: 'Action', anilistGenre: 'Action', anilistTag: null },
                { name: 'Comedy', query: 'Comedy', anilistGenre: 'Comedy', anilistTag: null },
                { name: 'Fantasy', query: 'Fantasy', anilistGenre: 'Fantasy', anilistTag: null },
                { name: 'Adventure & Sci-Fi', query: 'Adventure', anilistGenre: 'Adventure', anilistTag: null }
              ];
              
              function getCache() {
                try {
                  var raw = localStorage.getItem(CACHE_KEY);
                  if (!raw) return null;
                  var data = JSON.parse(raw);
                  if (Date.now() - data.fetchedAt > CACHE_TTL) return null;
                  return data;
                } catch(e) { return null; }
              }
              
              function setCache(feed) {
                try {
                  localStorage.setItem(CACHE_KEY, JSON.stringify({ fetchedAt: Date.now(), feed: feed }));
                } catch(e) {}
              }
              
              // Fetch dubbed anime by genre from AniList
              async function fetchGenreFeed(genre, pageNum) {
                pageNum = pageNum || 1;
                var isTag = !!genre.anilistTag;
                var query = isTag
                  ? 'query ($tag: String, $page: Int) { Page(page: $page, perPage: 50) { ' +
                    'pageInfo { hasNextPage } ' +
                    'media(tag: $tag, type: ANIME, sort: POPULARITY_DESC, isAdult: false) { ' +
                    'id title { english romaji } coverImage { large extraLarge } ' +
                    'averageScore genres format episodes seasonYear } } }'
                  : 'query ($genre: String, $page: Int) { Page(page: $page, perPage: 50) { ' +
                    'pageInfo { hasNextPage } ' +
                    'media(genre: $genre, type: ANIME, sort: POPULARITY_DESC, isAdult: false) { ' +
                    'id title { english romaji } coverImage { large extraLarge } ' +
                    'averageScore genres format episodes seasonYear } } }';
                try {
                  var res = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, variables: isTag ? { tag: genre.anilistTag, page: pageNum } : { genre: genre.anilistGenre, page: pageNum } })
                  });
                  var data = await res.json();
                  var page = (data.data && data.data.Page) || {};
                  var items = page.media || [];
                  var hasNext = page.pageInfo && page.pageInfo.hasNextPage;
                  // Filter for likely-dubbed (popular titles tend to have dubs)
                  var mapped = items.map(function(m){
                    return {
                      id: m.id,
                      title: m.title.english || m.title.romaji,
                      poster: (m.coverImage && (m.coverImage.extraLarge || m.coverImage.large)) || '',
                      rating: m.averageScore ? (m.averageScore/10).toFixed(1) : null,
                      genres: m.genres || [],
                      format: m.format,
                      episodes: m.episodes,
                      year: m.seasonYear,
                      // Dub badges - will be verified via streaming API
                      hasDub: true, // Assume popular titles have dubs
                      dubLang: 'EN'
                    };
                  });
                  return { items: mapped, hasNextPage: hasNext };
                } catch(e) { return { items: [], hasNextPage: false }; }
              }
              
              async function loadDiscoverFeed(forceRefresh) {
                if (!forceRefresh) {
                  var cached = getCache();
                  if (cached) return cached.feed;
                }
                var feed = {};
                for (var i = 0; i < GENRES.length; i++) {
                  var result = await fetchGenreFeed(GENRES[i], 1);
                  feed[GENRES[i].name] = result.items || [];
                }
                setCache(feed);
                return feed;
              }
              
              // Open Discover card in native detail view (with discoverCached flag)
              function openDiscoverDetail(item) {
                var kind = (item.format && String(item.format).toUpperCase() === 'MOVIE') ? 'movie' : 'series';
                // Use openOnlineAsNative which calls addCollection then opens native detail
                if (window.openOnlineAsNative) {
                  // Temporarily mark as discover-cached via a flag
                  window.__discoverOpen = true;
                  window.openOnlineAsNative({ title: item.title, kind: kind, format: item.format, year: item.year });
                  setTimeout(function(){ window.__discoverOpen = false; }, 2000);
                }
              }
              // Toggle watchlist heart
              function toggleWatchlist(title, btnEl) {
                try {
                  var dbRaw = localStorage.getItem('media_player_exact_db_v5');
                  if (!dbRaw) return;
                  var db = JSON.parse(dbRaw);
                  var normKey = title.toLowerCase().replace(/[^a-z0-9]/g, '');
                  var col = db.collections.find(function(c){
                    return c.title.toLowerCase().replace(/[^a-z0-9]/g, '') === normKey;
                  });
                  if (col) {
                    col.isWatchlist = !col.isWatchlist;
                    if (col.isWatchlist) col.discoverCached = false;
                    localStorage.setItem('media_player_exact_db_v5', JSON.stringify(db));
                    if (btnEl) btnEl.textContent = col.isWatchlist ? '❤️' : '🤍';
                    // Refresh collections list
                    if (window.__refreshCollections) window.__refreshCollections();
                    if (window.awToast) awToast(col.isWatchlist ? 'Added to watchlist ♥' : 'Removed from watchlist');
                  } else {
                    // Not in DB yet, add it as watchlisted
                    if (window.handleAction) {
                      window.handleAction('addCollection', { title: title, kind: 'series', files: [], isWatchlist: true }).then(function(){
                        if (btnEl) btnEl.textContent = '❤️';
                        if (window.awToast) awToast('Added to watchlist ♥');
                      });
                    }
                  }
                } catch(e) {}
              }
              function renderDiscover() {
                // Hide main content, show discover view
                var main = document.querySelector('main') || document.querySelector('[class*="main"]');
                if (!main) return;
                
                // Create discover container
                var disc = document.getElementById('discover-view');
