                      awToast('Could not load details');
                    }
                  };
                });
                // Wire heart buttons
                container.querySelectorAll('.disc-heart').forEach(function(hb){
                  hb.onclick = function(e){
                    e.stopPropagation();
                    toggleWatchlist(hb.getAttribute('data-title'), hb);
